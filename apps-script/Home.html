<!doctype html>
<html lang="cs">
<head>
  <base target="_top">

  <title>CoLector</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182238;background:#f4f6fb;--accent:#079EAE;--line:#e4e8f0;--muted:#748096;--header:76px;--section:86px}*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#f4f6fb}body{overscroll-behavior-y:none}button{font:inherit;cursor:pointer}.app-header{position:fixed;z-index:50;top:0;left:0;right:0;height:var(--header);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;background:rgba(255,255,255,.97);border-bottom:1px solid #e6e9f0;box-shadow:0 2px 12px rgba(28,38,64,.05)}.brand-wrap{display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}.brand-mark{width:44px;height:44px;flex:0 0 auto}.brand-mark svg{display:block;width:100%;height:100%}.section-name{font-size:14px;color:#68748a;font-weight:700}.header-nav{display:flex;gap:9px}.nav-btn{width:54px;height:54px;border:1px solid #dde3ec;border-radius:17px;background:#fff;color:#7c8799;display:grid;place-items:center;padding:0}.nav-btn svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.8}.nav-btn.active{background:linear-gradient(145deg,#12B8B5,#069EAE 55%,#087CA8);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(7,158,174,.22)}.section-head{position:fixed;z-index:40;top:var(--header);left:50%;transform:translateX(-50%);width:min(calc(100% - 28px),620px);min-height:var(--section);display:flex;align-items:center;gap:16px;padding:13px 18px;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 24px 24px;box-shadow:0 8px 24px rgba(26,37,62,.055)}.section-icon{width:60px;height:60px;display:grid;place-items:center;color:#079EAE;flex:0 0 auto}.section-icon svg{width:45px;height:45px;stroke:currentColor;fill:none;stroke-width:1.75}.section-title{font-size:21px;font-weight:850;color:#27334a}main{width:min(100%,620px);margin:0 auto;padding:calc(var(--header) + var(--section) + 10px) 8px 128px}.forms-list{display:grid;gap:8px}.form-row{min-height:78px;display:grid;grid-template-columns:46px minmax(0,1fr);align-items:center;gap:6px}.form-qr{width:38px;height:38px;border:0;border-radius:12px;display:grid;place-items:center;background:#e7f8f8;color:#078f9f;padding:0}.form-qr:disabled{background:#f1f3f5;color:#b8bec8;cursor:default}.form-qr svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}.form-card{min-width:0;min-height:70px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;background:#fff;border:1px solid #edf0f5;border-radius:14px;overflow:hidden}.form-row.collecting .form-card{background:#eef6ff}.form-row.complete .form-card{background:#edf9f1}.form-main{min-width:0;height:100%;border:0;background:transparent;text-align:left;padding:11px 8px 11px 14px;color:#27334a}.form-title{font-weight:740;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.form-meta{margin-top:5px;display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}.progress{padding:2px 7px;border-radius:999px;background:rgba(7,158,174,.10);color:#087f8d;font-weight:800}.complete .progress{background:rgba(47,151,91,.12);color:#2c8653}.form-actions{display:flex;align-items:center;padding-right:4px}.form-action{width:34px;height:36px;padding:0;border:0;border-radius:10px;background:transparent;color:#657086;display:grid;place-items:center}.form-action:hover{background:rgba(255,255,255,.72)}.form-action svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9}.form-action.danger{color:#c54c56}.form-action.danger:hover{background:#fff0f1}.empty{padding:24px 18px;background:#fff;border:1px solid var(--line);border-radius:16px;color:var(--muted);text-align:center}.home-bottom-dock{position:fixed;z-index:45;left:0;right:0;bottom:0;padding:30px 14px max(14px,env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(244,246,251,0),rgba(244,246,251,.95) 28%,#f4f6fb 52%)}.home-bottom-inner{width:min(100%,620px);margin:0 auto}.new-form{width:100%;min-height:84px;border:0;border-radius:28px;background:linear-gradient(135deg,#12B8B5,#069EAE 55%,#087CA8);color:#fff;font-size:21px;font-weight:820;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px rgba(7,158,174,.22)}.new-form .plus{font-size:34px;font-weight:400;line-height:1}.loading-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.96);opacity:1;transition:opacity 180ms ease}.loading-overlay.hidden{opacity:0;pointer-events:none}.loading-box{display:flex;flex-direction:column;align-items:center;gap:14px}.colector-loader,.colector-loader-svg{width:120px;height:120px}.loader-layer{transform-box:fill-box;transform-origin:center;opacity:0}.loader-layer-top{animation:top 2.2s ease-in-out infinite}.loader-layer-middle{animation:middle 2.2s ease-in-out infinite}.loader-layer-bottom{animation:bottom 2.2s ease-in-out infinite}.loading-text{font-size:16px;font-weight:650;color:#27334a}@keyframes top{0%{transform:translateY(-16px);opacity:0}22%{transform:translateY(0);opacity:1}48%{opacity:1}84%,100%{transform:translateY(30px);opacity:0}}@keyframes middle{0%,14%{transform:translateY(-14px);opacity:0}36%{transform:translateY(0);opacity:1}48%{opacity:1}88%,100%{transform:translateY(30px);opacity:0}}@keyframes bottom{0%,28%{transform:translateY(-12px);opacity:0}48%{transform:translateY(0);opacity:1}56%{opacity:1}92%,100%{transform:translateY(30px);opacity:0}}@media(prefers-reduced-motion:reduce){.loader-layer{animation:none!important;opacity:1;transform:none}}.qr-screen{position:fixed;z-index:100;inset:0;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px}.qr-screen.open{display:flex}.qr-close{position:absolute;top:14px;right:14px;width:44px;height:44px;border:0;border-radius:12px;background:#f1f3f8;color:#556178;font-size:26px}.qr-title{margin:0 0 20px;text-align:center;font-size:26px;color:#27334a}.qr-box{padding:14px;background:#fff;border-radius:18px;box-shadow:0 10px 34px rgba(25,35,58,.12)}@media(max-width:520px){:root{--header:72px;--section:84px}.brand-mark{width:40px;height:40px}.section-name{font-size:12px}.nav-btn{width:50px;height:50px;border-radius:15px}.nav-btn svg{width:25px;height:25px}.header-nav{gap:7px}.section-title{font-size:20px}}
  </style>
</head>
<body>
  <header class="app-header"><div id="homeBrand" class="brand-wrap"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 256 256"><defs><linearGradient id="brandG" x1="20%" y1="10%" x2="85%" y2="90%"><stop offset="0%" stop-color="#12B8B5"/><stop offset="52%" stop-color="#069EAE"/><stop offset="100%" stop-color="#087CA8"/></linearGradient></defs><rect x="16" y="16" width="224" height="224" rx="48" fill="url(#brandG)"/><path d="M128 69 L180 99 Q186 103 180 107 L128 137 L76 107 Q70 103 76 99 Z" fill="#fff"/><path d="M78 126 L128 155 L178 126 L178 140 L128 169 L78 140 Z" fill="#fff"/><path d="M78 151 L128 180 L178 151 L178 165 L128 194 L78 165 Z" fill="#fff"/></svg></div><span class="section-name">/ Home</span></div><nav class="header-nav"><button class="nav-btn active" title="Formuláře" aria-label="Formuláře"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4"/><path d="M9 11h6M9 15h6"/></svg></button><button id="navTemplates" class="nav-btn" title="Šablony" aria-label="Šablony"><svg viewBox="0 0 24 24"><path d="M7 3h8l3 3v15H7z"/><path d="M15 3v4h4"/></svg></button><button id="navData" class="nav-btn" title="Data" aria-label="Data"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button></nav></header>
  <div class="section-head"><div class="section-icon"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4"/><path d="M9 11h6M9 15h6"/></svg></div><div class="section-title">Moje formuláře</div></div>
  <main><div id="recentForms" class="forms-list"></div></main>
  <div class="home-bottom-dock"><div class="home-bottom-inner"><button id="newForm" class="new-form"><span class="plus">＋</span><span>Nový formulář</span></button></div></div>
  <div id="loadingOverlay" class="loading-overlay"><div class="loading-box"><svg viewBox="0 0 160 160" class="colector-loader-svg"><defs><linearGradient id="loaderG" x1="20%" y1="10%" x2="85%" y2="90%"><stop offset="0%" stop-color="#12B8B5"/><stop offset="52%" stop-color="#069EAE"/><stop offset="100%" stop-color="#087CA8"/></linearGradient></defs><g class="loader-layer loader-layer-top"><path fill="url(#loaderG)" d="M80 20 L132 50 Q138 54 132 58 L80 88 L28 58 Q22 54 28 50 Z"/></g><g class="loader-layer loader-layer-middle"><path fill="url(#loaderG)" d="M30 74 L80 103 L130 74 L130 88 L80 117 L30 88 Z"/></g><g class="loader-layer loader-layer-bottom"><path fill="url(#loaderG)" d="M30 102 L80 131 L130 102 L130 116 L80 145 L30 116 Z"/></g></svg><div class="loading-text">Collecting…</div></div></div>
  <div id="qrScreen" class="qr-screen"><button id="qrClose" class="qr-close">×</button><h1 id="qrTitle" class="qr-title"></h1><div id="qrBox" class="qr-box"></div></div>
  <script>
    const APP_URL=<?!= JSON.stringify(appUrl) ?>,recentFormsEl=document.getElementById('recentForms'),qrScreen=document.getElementById('qrScreen'),qrBox=document.getElementById('qrBox'),qrTitle=document.getElementById('qrTitle');
    const go=q=>window.top.location.href=APP_URL+q;const participantUrl=id=>APP_URL+'?view=form&form='+encodeURIComponent(id);const fmt=v=>{if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('cs-CZ',{day:'numeric',month:'numeric',year:'numeric'}).format(d)};
    function hideLoader(){const x=document.getElementById('loadingOverlay');x.classList.add('hidden');setTimeout(()=>x.style.display='none',180)}
    function loadQr(){if(window.QRCode)return Promise.resolve();return new Promise((ok,bad)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s)})}
    function showQr(form){if(!form.publishedAt){alert('Formulář nejdřív publikuj v Editoru.');return}qrTitle.textContent=form.title||form.internalTitle||'Formulář';qrBox.innerHTML='';qrScreen.classList.add('open');loadQr().then(()=>new QRCode(qrBox,{text:participantUrl(form.formId),width:260,height:260,colorDark:'#111827',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M})).catch(()=>qrBox.textContent='QR kód se nepodařilo načíst.')}
    function render(forms){recentFormsEl.innerHTML='';const items=(forms||[]).slice(0,7);if(!items.length){recentFormsEl.innerHTML='<div class="empty">Zatím nemáš žádný formulář.</div>';return}items.forEach(form=>{const distributed=Number(form.distributedCount)||0,collected=Number(form.collectedCount)||0;const row=document.createElement('div');row.className='form-row';if(distributed>0)row.classList.add(collected>=distributed?'complete':'collecting');const qr=document.createElement('button');qr.className='form-qr';qr.innerHTML='<svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3z"/><path d="M15 14h2v2h-2zM19 14h2v4h-2zM14 19h4v2h-4zM20 20h1v1h-1z"/></svg>';if(form.publishedAt)qr.onclick=e=>{e.stopPropagation();showQr(form)};else qr.disabled=true;const card=document.createElement('div');card.className='form-card';const main=document.createElement('button');main.className='form-main';main.innerHTML='<div class="form-title"></div><div class="form-meta"><span>'+fmt(form.updatedAt||form.createdAt)+'</span></div>';main.querySelector('.form-title').textContent=form.internalTitle||form.title||'Bez názvu';if(distributed>0){const p=document.createElement('span');p.className='progress';p.textContent=collected+'/'+distributed;main.querySelector('.form-meta').append(p)}main.onclick=()=>go('?view=session&form='+encodeURIComponent(form.formId));const actions=document.createElement('div');actions.className='form-actions';const edit=action('Editor','<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',()=>go('?view=editor&form='+encodeURIComponent(form.formId)));const dup=action('Duplikovat','<svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',()=>google.script.run.withSuccessHandler(r=>r&&r.formId?go('?view=editor&form='+encodeURIComponent(r.formId)):load()).duplicateFormDraft(form.formId));const del=action('Smazat','<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14"/></svg>',()=>{if(confirm('Smazat tento formulář?'))google.script.run.withSuccessHandler(load).deleteFormDraft(form.formId)},true);actions.append(edit,dup,del);card.append(main,actions);row.append(qr,card);recentFormsEl.append(row)})}
    function action(title,html,fn,danger){const b=document.createElement('button');b.className='form-action'+(danger?' danger':'');b.title=title;b.innerHTML=html;b.onclick=e=>{e.stopPropagation();fn()};return b}
    function load(){google.script.run.withSuccessHandler(forms=>{render(forms);hideLoader()}).withFailureHandler(()=>{recentFormsEl.innerHTML='<div class="empty">Formuláře se nepodařilo načíst.</div>';hideLoader()}).getHomeFormSummaries()}
    document.getElementById('homeBrand').onclick=()=>go('?view=home');document.getElementById('navTemplates').onclick=()=>go('?view=forms');document.getElementById('navData').onclick=()=>go('?view=data');document.getElementById('newForm').onclick=()=>go('?view=forms&mode=new-form');document.getElementById('qrClose').onclick=()=>qrScreen.classList.remove('open');load();
  </script>
</body>
</html>
