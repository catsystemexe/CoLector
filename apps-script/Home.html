/* Home form list refinement */
.new-form{
  margin-top:2px;
  border-radius:27px!important;
}

.form-row{
  min-height:78px!important;
  display:grid!important;
  grid-template-columns:52px minmax(0,1fr)!important;
  align-items:center!important;
  gap:8px!important;
  padding:0 8px 0 6px!important;
  background:transparent!important;
  border-bottom:0!important;
}

.form-card{
  min-width:0;
  min-height:70px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  background:#fff;
  border:1px solid #edf0f5;
  border-radius:14px;
  overflow:hidden;
}

.form-row.collecting .form-card{
  background:#eef6ff;
}

.form-row.complete .form-card{
  background:#edf9f1;
}

.form-qr{
  width:42px;
  height:42px;
  margin-left:0;
  border:0;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:#e7f8f8;
  color:#078f9f;
  padding:0;
}

.form-qr:hover{
  background:#d9f3f3;
}

.form-qr:disabled{
  background:#f1f3f5;
  color:#b8bec8;
  cursor:default;
  opacity:.85;
}

.form-qr:disabled:hover{
  background:#f1f3f5;
}

.form-qr svg{
  width:23px;
  height:23px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
}

.form-main{
  min-width:0;
  height:100%;
  padding:11px 8px 11px 14px!important;
}

.form-topline{
  display:block!important;
}

.form-meta{
  margin-top:5px;
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.form-date{
  margin-top:0!important;
}

.progress{
  min-width:auto!important;
  padding:2px 7px!important;
  font-size:11px!important;
}

.form-actions{
  display:flex;
  align-items:center;
  gap:2px;
  padding-right:8px;
}

.form-action{
  width:38px;
  height:38px;
  padding:0;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#657086;
  display:grid;
  place-items:center;
}

.form-action:hover{
  background:rgba(255,255,255,.72);
}

.form-action svg{
  width:19px;
  height:19px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.9;
}

.form-action.danger{
  color:#c54c56;
}

.form-action.danger:hover{
  background:#fff0f1;
}

/* old overflow menu no longer used */
.more,.action-menu{
  display:none!important;
}

@media(max-width:520px){
  .form-row{
    grid-template-columns:46px minmax(0,1fr)!important;
    gap:6px!important;
    padding-left:4px!important;
    padding-right:4px!important;
  }
  .form-qr{
    width:38px;
    height:38px;
    margin-left:0;
  }
  .form-actions{
    gap:0;
    padding-right:4px;
  }
  .form-action{
    width:34px;
    height:36px;
  }
  .form-action svg{
    width:18px;
    height:18px;
  }
}


/* Forms section: no shared white background behind individual rows */
.card{
  background:transparent!important;
  border-color:transparent!important;
  box-shadow:none!important;
}

.section-button{
  border:1px solid var(--line)!important;
  border-radius:18px!important;
  box-shadow:0 8px 24px rgba(26,37,62,.055);
}

.forms-list{
  border-top:0!important;
  background:transparent!important;
  margin-top:8px;
  display:grid;
  gap:8px;
}

.form-row{
  background:transparent!important;
}


/* ---------- Home hierarchy / fixed bottom dock ---------- */

main{
  padding-bottom:210px!important;
}

/* "Moje formuláře" is a section label, not navigation */
.section-button:disabled{
  cursor:default;
  opacity:1;
  color:#27334a;
}

.section-button:disabled:hover{
  background:#f8f9fe;
}

/* Category icons: larger and no tile/background */
.section-button .section-icon,
.data-card .section-icon{
  width:54px!important;
  height:54px!important;
  border-radius:0!important;
  background:transparent!important;
  color:#079EAE!important;
}

.section-button .section-icon svg,
.data-card .section-icon svg{
  width:31px!important;
  height:31px!important;
  stroke-width:1.9!important;
}

/* Fixed bottom action area */
.home-bottom-dock{
  position:fixed;
  z-index:25;
  left:0;
  right:0;
  bottom:0;
  padding:34px 14px max(14px, env(safe-area-inset-bottom));
  background:
    linear-gradient(
      to bottom,
      rgba(244,246,251,0),
      rgba(244,246,251,.94) 22%,
      #f4f6fb 48%
    );
  pointer-events:none;
}

.home-bottom-inner{
  width:min(100%,620px);
  margin:0 auto;
  display:grid;
  gap:10px;
  pointer-events:auto;
}

.home-bottom-inner .data-card{
  min-height:66px;
}

.home-bottom-inner .new-form{
  min-height:66px;
  margin:0!important;
  border-radius:28px!important;
}

/* Form list can naturally continue behind/above the dock while page scrolls */
.forms-list{
  padding-bottom:4px;
}

@media(max-width:760px){
  main{
    padding-bottom:205px!important;
  }

  .home-bottom-dock{
    padding-left:14px;
    padding-right:14px;
  }

  .section-button .section-icon,
  .data-card .section-icon{
    width:50px!important;
    height:50px!important;
  }

  .section-button .section-icon svg,
  .data-card .section-icon svg{
    width:29px!important;
    height:29px!important;
  }
}

/* ---------- Home fixed section header ---------- */

main{
  padding-top:94px!important;
}

main > .stack{
  margin-top:0!important;
}

/* Moje formuláře fixed directly under app header */
.card{
  position:static!important;
}

.section-button{
  position:fixed!important;
  z-index:24!important;
  top:var(--header-height)!important;
  left:50%!important;
  transform:translateX(-50%)!important;
  width:min(calc(100% - 28px),620px)!important;
  min-height:104px!important;
  border:1px solid var(--line)!important;
  border-radius:0 0 24px 24px!important;
  background:#fff!important;
  box-shadow:0 8px 24px rgba(26,37,62,.055)!important;
  padding:16px 22px!important;
}

.section-button:disabled:hover{
  background:#fff!important;
}

/* category icons nearly full card height */
.section-button .section-icon,
.data-card .section-icon{
  width:72px!important;
  height:72px!important;
  flex:0 0 72px!important;
  background:transparent!important;
  border-radius:0!important;
}

.section-button .section-icon svg,
.data-card .section-icon svg{
  width:52px!important;
  height:52px!important;
  stroke-width:1.75!important;
}

/* remove any residual grey tint */
.section-button{
  color:#27334a!important;
}

.forms-list{
  margin-top:0!important;
}

@media(max-width:760px){
  main{
    padding-top:94px!important;
  }

  .section-button{
    min-height:96px!important;
    padding:12px 18px!important;
  }

  .section-button .section-icon,
  .data-card .section-icon{
    width:66px!important;
    height:66px!important;
    flex-basis:66px!important;
  }

  .section-button .section-icon svg,
  .data-card .section-icon svg{
    width:48px!important;
    height:48px!important;
  }
}

/* ---------- Section sizing refinement ---------- */

/* Moje formuláře: cca -10 % */
.section-button{
  min-height:86px!important;
}

/* Data: cca -10 % */
.home-bottom-inner .data-card{
  min-height:60px!important;
}

/* Nový formulář: cca +25 %, minimálně stejně výrazný */
.home-bottom-inner .new-form{
  min-height:84px!important;
}

/* Larger labels */
.section-button .section-title{
  font-size:22px!important;
}

.home-bottom-inner .data-title{
  font-size:21px!important;
}

.home-bottom-inner .new-form{
  font-size:22px!important;
}

/* Larger + on New form */
.home-bottom-inner .new-form > span:first-child{
  font-size:34px!important;
  line-height:1!important;
  font-weight:400!important;
}

/* Keep category icons proportionate to reduced card height */
.section-button .section-icon{
  width:62px!important;
  height:62px!important;
  flex-basis:62px!important;
}

.section-button .section-icon svg{
  width:45px!important;
  height:45px!important;
}

.data-card .section-icon{
  width:58px!important;
  height:58px!important;
  flex-basis:58px!important;
}

.data-card .section-icon svg{
  width:43px!important;
  height:43px!important;
}

@media(max-width:760px){
  .section-button{
    min-height:86px!important;
  }

  .home-bottom-inner .data-card{
    min-height:60px!important;
  }

  .home-bottom-inner .new-form{
    min-height:84px!important;
  }

  .section-button .section-title{
    font-size:21px!important;
  }

  .home-bottom-inner .data-title,
  .home-bottom-inner .new-form{
    font-size:21px!important;
  }

  .home-bottom-inner .new-form > span:first-child{
    font-size:32px!important;
  }
}

/* Prevent form list from pulling down below section header */
html,body{
  overscroll-behavior-y:none!important;
}

main{
  overscroll-behavior-y:contain!important;
}

.forms-list{
  overscroll-behavior-y:contain!important;
}

/* ---------- CoLector loading overlay ---------- */

.loading-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.96);
  opacity:1;
  transition:opacity 180ms ease;
}

.loading-overlay.hidden{
  opacity:0;
  pointer-events:none;
}

.loading-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  padding:20px;
  text-align:center;
}

.colector-loader{
  width:120px;
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.colector-loader-svg{
  width:120px;
  height:120px;
  overflow:visible;
}

.loading-text{
  font-size:16px;
  font-weight:650;
  color:#27334a;
  letter-spacing:.1px;
}

.loader-layer{
  transform-box:fill-box;
  transform-origin:center center;
  opacity:0;
}

.loader-layer-top{
  animation:colectorLayerTop 2.2s ease-in-out infinite;
}

.loader-layer-middle{
  animation:colectorLayerMiddle 2.2s ease-in-out infinite;
}

.loader-layer-bottom{
  animation:colectorLayerBottom 2.2s ease-in-out infinite;
}

@keyframes colectorLayerTop{
  0%{transform:translateY(-16px);opacity:0}
  12%{transform:translateY(-6px);opacity:.35}
  22%{transform:translateY(0);opacity:1}
  48%{transform:translateY(0);opacity:1}
  68%{transform:translateY(16px);opacity:.45}
  84%,100%{transform:translateY(30px);opacity:0}
}

@keyframes colectorLayerMiddle{
  0%,14%{transform:translateY(-14px);opacity:0}
  26%{transform:translateY(-4px);opacity:.35}
  36%{transform:translateY(0);opacity:1}
  48%{transform:translateY(0);opacity:1}
  72%{transform:translateY(16px);opacity:.45}
  88%,100%{transform:translateY(30px);opacity:0}
}

@keyframes colectorLayerBottom{
  0%,28%{transform:translateY(-12px);opacity:0}
  40%{transform:translateY(-3px);opacity:.35}
  48%{transform:translateY(0);opacity:1}
  56%{transform:translateY(0);opacity:1}
  78%{transform:translateY(16px);opacity:.45}
  92%,100%{transform:translateY(30px);opacity:0}
}

@media(prefers-reduced-motion:reduce){
  .loader-layer-top,
  .loader-layer-middle,
  .loader-layer-bottom{
    animation:none;
    opacity:1;
    transform:none;
  }
}

</style>

        </svg>
      </div>

      <div id="loadingText" class="loading-text">Collecting…</div>
    </div>
  </div>

  <div id="qrScreen" class="qr-screen"><button id="qrClose" class="qr-close" type="button" aria-label="Zavřít">×</button><h1 id="qrTitle" class="qr-title"></h1><div id="qrBox" class="qr-box"></div><div class="qr-note">Naskenujte QR kód fotoaparátem telefonu.</div></div>
  <script>
    const APP_URL=<?!= JSON.stringify(appUrl) ?>;
    const recentFormsEl=document.getElementById('recentForms');
    const qrScreen=document.getElementById('qrScreen'),qrBox=document.getElementById('qrBox'),qrTitle=document.getElementById('qrTitle');
    let cachedForms=[];
    function go(query){window.top.location.href=APP_URL+query}
    function participantUrl(formId){return APP_URL+'?view=form&form='+encodeURIComponent(formId)}
    function formatDate(value){if(!value)return'';const d=new Date(value);if(Number.isNaN(d.getTime()))return'';return new Intl.DateTimeFormat('cs-CZ',{day:'numeric',month:'numeric',year:'numeric'}).format(d)}
    function closeMenus(){document.querySelectorAll('.action-menu.open').forEach(menu=>menu.classList.remove('open'))}
    function loadQrLibrary(){if(window.QRCode)return Promise.resolve();return new Promise((resolve,reject)=>{const existing=document.querySelector('script[data-colector-qr]');if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});return}const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js';script.dataset.colectorQr='1';script.onload=resolve;script.onerror=reject;document.head.appendChild(script)})}
    function showQr(form){closeMenus();if(!form.publishedAt){alert('Formulář nejdřív publikuj v Editoru.');return}qrTitle.textContent=form.title||form.internalTitle||'Formulář';qrBox.innerHTML='';qrScreen.classList.add('open');loadQrLibrary().then(()=>{const size=Math.max(220,Math.min(520,Math.floor(Math.min(window.innerWidth*.72,window.innerHeight*.62))));new QRCode(qrBox,{text:participantUrl(form.formId),width:size,height:size,colorDark:'#111827',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}).catch(()=>{qrBox.textContent='QR kód se nepodařilo načíst.'})}

    function showLoader(text){
      const overlay=document.getElementById('loadingOverlay');
      const label=document.getElementById('loadingText');
      if(!overlay)return;
      if(text&&label)label.textContent=text;
      overlay.style.display='flex';
      requestAnimationFrame(()=>overlay.classList.remove('hidden'));
      overlay.setAttribute('aria-busy','true');
    }

    function hideLoader(){
      const overlay=document.getElementById('loadingOverlay');
      if(!overlay)return;
      overlay.classList.add('hidden');
      overlay.setAttribute('aria-busy','false');
      setTimeout(()=>{overlay.style.display='none'},180);
    }

    function loadForms(){
      showLoader('Collecting…');
      google.script.run
        .withSuccessHandler(forms=>{
          cachedForms=forms||[];
          renderRecent(cachedForms);
          hideLoader();
        })
        .withFailureHandler(error=>{
          hideLoader();
          renderError(error);
        })
        .getHomeFormSummaries();
    }
    function renderRecent(forms){
      recentFormsEl.innerHTML='';
      const recent=(forms||[]).slice(0,7);

      if(!recent.length){
        recentFormsEl.innerHTML='<div class="empty">Zatím nemáš žádný uložený formulář.</div>';
        return;
      }

      recent.forEach(form=>{
        const distributed=Number(form.distributedCount)||0;
        const collected=Number(form.collectedCount)||0;

        const row=document.createElement('div');
        row.className='form-row';
        if(distributed>0)row.classList.add(collected>=distributed?'complete':'collecting');

        /* QR */
        const qr=document.createElement('button');
        qr.className='form-qr';
        qr.type='button';
        qr.title='QR kód';
        qr.setAttribute('aria-label','Zobrazit QR kód');
        qr.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3z"/><path d="M15 14h2v2h-2zM19 14h2v4h-2zM14 19h4v2h-4zM20 20h1v1h-1z"/></svg>';
        if(form.publishedAt){
          qr.onclick=e=>{
            e.stopPropagation();
            showQr(form);
          };
        }else{
          qr.disabled=true;
          qr.title='Formulář ještě nebyl publikován';
          qr.setAttribute('aria-label','QR není dostupné – formulář ještě nebyl publikován');
        }

        /* Main content -> Sheet */
        const main=document.createElement('button');
        main.className='form-main';
        main.type='button';
        main.title='Otevřít data formuláře';

        const top=document.createElement('div');
        top.className='form-topline';

        const title=document.createElement('div');
        title.className='form-title';
        title.textContent=form.internalTitle||form.title||'Bez názvu';
        top.appendChild(title);

        const meta=document.createElement('div');
        meta.className='form-meta';

        const date=document.createElement('span');
        date.className='form-date';
        date.textContent=formatDate(form.updatedAt||form.createdAt);
        meta.appendChild(date);

        if(distributed>0){
          const progress=document.createElement('span');
          progress.className='progress';
          progress.textContent=collected+'/'+distributed;
          progress.title=collected+' odevzdaných z '+distributed+' rozdaných';
          meta.appendChild(progress);
        }

        main.append(top,meta);

        main.onclick=()=>{
          go('?view=session&form='+encodeURIComponent(form.formId));
        };

        /* Right actions */
        const actions=document.createElement('div');
        actions.className='form-actions';

        const edit=document.createElement('button');
        edit.className='form-action';
        edit.type='button';
        edit.title='Editor';
        edit.setAttribute('aria-label','Otevřít Editor');
        edit.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/></svg>';
        edit.onclick=e=>{
          e.stopPropagation();
          go('?view=editor&form='+encodeURIComponent(form.formId));
        };

        const duplicate=document.createElement('button');
        duplicate.className='form-action';
        duplicate.type='button';
        duplicate.title='Duplikovat';
        duplicate.setAttribute('aria-label','Duplikovat formulář');
        duplicate.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>';
        duplicate.onclick=e=>{
          e.stopPropagation();
          duplicate.disabled=true;
          google.script.run
            .withSuccessHandler(result=>{
              duplicate.disabled=false;
              if(result&&result.formId){
                go('?view=editor&form='+encodeURIComponent(result.formId));
              }else{
                loadForms();
              }
            })
            .withFailureHandler(err=>{
              duplicate.disabled=false;
              alert((err&&err.message)||'Duplikace se nepodařila.');
            })
            .duplicateFormDraft(form.formId);
        };

        const remove=document.createElement('button');
        remove.className='form-action danger';
        remove.type='button';
        remove.title='Smazat';
        remove.setAttribute('aria-label','Smazat formulář');
        remove.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></svg>';
        remove.onclick=e=>{
          e.stopPropagation();
          const name=form.internalTitle||form.title||'tento formulář';
          if(!confirm('Opravdu chceš smazat „'+name+'“?'))return;

          remove.disabled=true;
          google.script.run
            .withSuccessHandler(()=>loadForms())
            .withFailureHandler(err=>{
              remove.disabled=false;
              alert((err&&err.message)||'Smazání se nepodařilo.');
            })
            .deleteFormDraft(form.formId);
        };

        actions.append(edit,duplicate,remove);

        const card=document.createElement('div');
        card.className='form-card';
        card.append(main,actions);

        row.append(qr,card);
        recentFormsEl.appendChild(row);
      });
    }

    function renderError(error){
      console.error(error);
      recentFormsEl.innerHTML='<div class="empty">Formuláře se nepodařilo načíst.</div>';
    }
    document.addEventListener('click',closeMenus);document.getElementById('qrClose').onclick=()=>qrScreen.classList.remove('open');const homeBrand=document.getElementById('homeBrand');homeBrand.onclick=()=>go('?view=home');homeBrand.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go('?view=home')}};document.getElementById('newForm').onclick=()=>go('?view=editor&new=1');document.getElementById('allForms').onclick=()=>go('?view=forms');document.getElementById('dataResults').onclick=()=>go('?view=data');loadForms();
  </script>
</body>
</html>
