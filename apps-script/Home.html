<!doctype html>
<html lang="cs">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#079EAE">
  <title>CoLector</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182238;background:#f4f6fb;--accent:#079EAE;--line:#e4e8f0;--muted:#748096;--header-height:84px}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:#f4f6fb}button{font:inherit;cursor:pointer}
    .app-header{position:sticky;top:0;z-index:30;min-height:var(--header-height);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;background:rgba(255,255,255,.98);border-bottom:1px solid #e6e9f0;box-shadow:0 2px 12px rgba(28,38,64,.05)}
    .brand-wrap{display:flex;align-items:center;gap:9px;white-space:nowrap;cursor:pointer;border-radius:11px;flex:0 0 auto}.brand-wrap:focus-visible{outline:3px solid rgba(7,158,174,.18);outline-offset:3px}.brand-mark{width:46px;height:46px;display:block;flex:0 0 auto}.brand-mark svg{display:block;width:100%;height:100%}.section-name{color:#6d778b;font-size:16px;font-weight:700}
    .header-nav{display:flex;align-items:flex-start;justify-content:flex-end;gap:10px;min-width:0}.nav-action{border:0;background:transparent;color:#6f7b90;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;min-width:58px}.nav-icon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;border:1px solid transparent;background:transparent}.nav-action svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8}.nav-label{font-size:10px;line-height:1;font-weight:800;white-space:nowrap}.nav-action.active{color:#079EAE}.nav-action.active .nav-icon{background:#e8f8f8;border-color:#c8eceb;box-shadow:0 6px 16px rgba(7,158,174,.10)}
    main{width:min(100%,620px);margin:0 auto;padding:96px 14px 150px}.stack{margin:0}.card{background:transparent;border:0;box-shadow:none}.section-button{position:fixed;z-index:24;top:var(--header-height);left:50%;transform:translateX(-50%);width:min(calc(100% - 28px),620px);min-height:86px;border:1px solid var(--line);border-radius:0 0 24px 24px;background:#fff;box-shadow:0 8px 24px rgba(26,37,62,.055);display:flex;align-items:center;gap:14px;padding:12px 18px;text-align:left;color:#27334a;cursor:default}.section-icon{width:62px;height:62px;display:grid;place-items:center;color:#079EAE;flex:0 0 62px}.section-icon svg{width:45px;height:45px;stroke:currentColor;fill:none;stroke-width:1.8}.section-title{font-size:21px;font-weight:850}
    .forms-list{display:grid;gap:8px;background:transparent}.form-row{min-height:78px;display:grid;grid-template-columns:46px minmax(0,1fr);align-items:center;gap:6px;padding:0 4px;background:transparent}.form-card{min-width:0;min-height:70px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;background:#fff;border:1px solid #edf0f5;border-radius:14px;overflow:hidden}.form-row.collecting .form-card{background:#eef6ff}.form-row.complete .form-card{background:#edf9f1}
    .form-qr{width:38px;height:38px;border:0;border-radius:13px;display:grid;place-items:center;background:#e7f8f8;color:#078f9f;padding:0}.form-qr:disabled{background:#f1f3f5;color:#b8bec8;cursor:default;opacity:.85}.form-qr svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}.form-main{min-width:0;height:100%;border:0;background:transparent;text-align:left;padding:11px 8px 11px 14px;color:#27334a}.form-title{font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.form-meta{margin-top:5px;display:flex;align-items:center;gap:9px}.form-date{color:var(--muted);font-size:13px}.progress{padding:2px 7px;border-radius:999px;background:rgba(7,158,174,.10);color:#087f8d;font-size:11px;font-weight:800}.complete .progress{background:rgba(47,151,91,.12);color:#2c8653}.form-actions{display:flex;align-items:center;padding-right:4px}.form-action{width:34px;height:36px;padding:0;border:0;border-radius:10px;background:transparent;color:#657086;display:grid;place-items:center}.form-action svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9}.form-action.danger{color:#c54c56}.empty{padding:18px 16px;color:var(--muted);font-size:14px}
    .home-bottom-dock{position:fixed;z-index:25;left:0;right:0;bottom:0;padding:34px 14px max(14px,env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(244,246,251,0),rgba(244,246,251,.94) 22%,#f4f6fb 48%);pointer-events:none}.home-bottom-inner{width:min(100%,620px);margin:0 auto;pointer-events:auto}.new-form{width:100%;min-height:84px;border:0;border-radius:28px;background:linear-gradient(135deg,#12B8B5 0%,#069EAE 55%,#087CA8 100%);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 9px 24px rgba(7,158,174,.22)}.new-form>span:first-child{font-size:34px;line-height:1;font-weight:400}
    .qr-screen{position:fixed;z-index:100;inset:0;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px}.qr-screen.open{display:flex}.qr-close{position:absolute;top:16px;right:16px;width:44px;height:44px;border:0;border-radius:12px;background:#f1f3f8;color:#556178;font-size:26px}.qr-title{max-width:90vw;text-align:center;font-size:clamp(24px,5vw,42px);font-weight:850;color:#27334a;margin:0 0 24px}.qr-box{padding:16px;background:#fff;border-radius:18px;box-shadow:0 10px 34px rgba(25,35,58,.12)}.qr-note{margin-top:18px;color:#7a8498;font-size:14px;text-align:center}
    .loading-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.96);opacity:1;transition:opacity 180ms ease}.loading-overlay.hidden{opacity:0;pointer-events:none}.loading-box{display:flex;flex-direction:column;align-items:center;gap:14px}.colector-loader{width:120px;height:120px;display:flex;align-items:center;justify-content:center}.colector-loader-svg{width:120px;height:120px;overflow:visible}.loading-text{font-size:16px;font-weight:650;color:#27334a}.loader-layer{transform-box:fill-box;transform-origin:center center;opacity:0}.loader-layer-top{animation:colectorLayerTop 2.2s ease-in-out infinite}.loader-layer-middle{animation:colectorLayerMiddle 2.2s ease-in-out infinite}.loader-layer-bottom{animation:colectorLayerBottom 2.2s ease-in-out infinite}
    @keyframes colectorLayerTop{0%{transform:translateY(-16px);opacity:0}22%{transform:translateY(0);opacity:1}48%{opacity:1}84%,100%{transform:translateY(30px);opacity:0}}@keyframes colectorLayerMiddle{0%,14%{transform:translateY(-14px);opacity:0}36%{transform:translateY(0);opacity:1}48%{opacity:1}88%,100%{transform:translateY(30px);opacity:0}}@keyframes colectorLayerBottom{0%,28%{transform:translateY(-12px);opacity:0}48%{transform:translateY(0);opacity:1}56%{opacity:1}92%,100%{transform:translateY(30px);opacity:0}}
    @media(prefers-reduced-motion:reduce){.loader-layer-top,.loader-layer-middle,.loader-layer-bottom{animation:none;opacity:1;transform:none}}
    @media(max-width:430px){:root{--header-height:80px}.app-header{padding:8px}.brand-mark{width:42px;height:42px}.section-name{font-size:14px}.header-nav{gap:4px}.nav-action{min-width:52px}.nav-icon{width:50px;height:50px}.nav-action svg{width:27px;height:27px}.nav-label{font-size:9px}main{padding-top:92px}.section-button{min-height:82px}.section-icon{width:56px;height:56px;flex-basis:56px}.section-icon svg{width:42px;height:42px}}
  </style>
</head>
<body>
  <header class="app-header">
    <div id="homeBrand" class="brand-wrap" role="link" tabindex="0" aria-label="Přejít na Home">
      <div class="brand-mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><defs><linearGradient id="colectorBrandGradient" x1="20%" y1="10%" x2="85%" y2="90%"><stop offset="0%" stop-color="#12B8B5"/><stop offset="52%" stop-color="#069EAE"/><stop offset="100%" stop-color="#087CA8"/></linearGradient></defs><rect x="16" y="16" width="224" height="224" rx="48" fill="url(#colectorBrandGradient)"/><path d="M128 69 L180 99 Q186 103 180 107 L128 137 L76 107 Q70 103 76 99 Z" fill="#fff"/><path d="M78 126 L128 155 L178 126 L178 140 L128 169 L78 140 Z" fill="#fff"/><path d="M78 151 L128 180 L178 151 L178 165 L128 194 L78 165 Z" fill="#fff"/></svg></div>
      <span class="section-name">/ Home</span>
    </div>
    <nav class="header-nav" aria-label="Hlavní navigace">
      <button class="nav-action active" type="button" aria-current="page" aria-label="Formuláře"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4"/><path d="M9 11h6M9 15h6"/></svg></span><span class="nav-label">Formuláře</span></button>
      <button id="navTemplates" class="nav-action" type="button" aria-label="Šablony"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M7 3h8l3 3v15H7z"/><path d="M15 3v4h4"/></svg></span><span class="nav-label">Šablony</span></button>
      <button id="navData" class="nav-action" type="button" aria-label="Data"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><span class="nav-label">Data</span></button>
    </nav>
  </header>
  <main><div class="stack"><section class="card" aria-labelledby="formsHeading"><div class="section-button"><span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4"/><path d="M9 11h6M9 15h6"/></svg></span><span id="formsHeading" class="section-title">Moje formuláře</span></div><div id="recentForms" class="forms-list"></div></section></div></main>
  <div class="home-bottom-dock"><div class="home-bottom-inner"><button id="newForm" class="new-form" type="button"><span aria-hidden="true">＋</span><span>Nový formulář</span></button></div></div>
  <div id="loadingOverlay" class="loading-overlay" aria-live="polite" aria-busy="true"><div class="loading-box"><div class="colector-loader" role="status" aria-label="Collecting"><svg viewBox="0 0 160 160" class="colector-loader-svg" aria-hidden="true"><defs><linearGradient id="colectorLoaderGradient" x1="20%" y1="10%" x2="85%" y2="90%"><stop offset="0%" stop-color="#12B8B5"></stop><stop offset="52%" stop-color="#069EAE"></stop><stop offset="100%" stop-color="#087CA8"></stop></linearGradient></defs><g class="loader-layer loader-layer-top"><path fill="url(#colectorLoaderGradient)" d="M80 20 L132 50 Q138 54 132 58 L80 88 L28 58 Q22 54 28 50 Z"></path></g><g class="loader-layer loader-layer-middle"><path fill="url(#colectorLoaderGradient)" d="M30 74 L80 103 L130 74 L130 88 L80 117 L30 88 Z"></path></g><g class="loader-layer loader-layer-bottom"><path fill="url(#colectorLoaderGradient)" d="M30 102 L80 131 L130 102 L130 116 L80 145 L30 116 Z"></path></g></svg></div><div id="loadingText" class="loading-text">Collecting…</div></div></div>
  <div id="qrScreen" class="qr-screen"><button id="qrClose" class="qr-close" type="button" aria-label="Zavřít">×</button><h1 id="qrTitle" class="qr-title"></h1><div id="qrBox" class="qr-box"></div><div class="qr-note">Naskenujte QR kód fotoaparátem telefonu.</div></div>
  <script>
    const APP_URL=<?!= JSON.stringify(appUrl) ?>;const recentFormsEl=document.getElementById('recentForms');const qrScreen=document.getElementById('qrScreen'),qrBox=document.getElementById('qrBox'),qrTitle=document.getElementById('qrTitle');let cachedForms=[];
    function go(query){window.top.location.href=APP_URL+query}function participantUrl(formId){return APP_URL+'?view=form&form='+encodeURIComponent(formId)}function formatDate(value){if(!value)return'';const d=new Date(value);if(Number.isNaN(d.getTime()))return'';return new Intl.DateTimeFormat('cs-CZ',{day:'numeric',month:'numeric',year:'numeric'}).format(d)}
    function loadQrLibrary(){if(window.QRCode)return Promise.resolve();return new Promise((resolve,reject)=>{const existing=document.querySelector('script[data-colector-qr]');if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});return}const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js';script.dataset.colectorQr='1';script.onload=resolve;script.onerror=reject;document.head.appendChild(script)})}function showQr(form){if(!form.publishedAt){alert('Formulář nejdřív publikuj v Editoru.');return}qrTitle.textContent=form.title||form.internalTitle||'Formulář';qrBox.innerHTML='';qrScreen.classList.add('open');loadQrLibrary().then(()=>{const size=Math.max(220,Math.min(520,Math.floor(Math.min(window.innerWidth*.72,window.innerHeight*.62))));new QRCode(qrBox,{text:participantUrl(form.formId),width:size,height:size,colorDark:'#111827',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M})}).catch(()=>{qrBox.textContent='QR kód se nepodařilo načíst.'})}
    function showLoader(){const o=document.getElementById('loadingOverlay');o.style.display='flex';requestAnimationFrame(()=>o.classList.remove('hidden'));o.setAttribute('aria-busy','true')}function hideLoader(){const o=document.getElementById('loadingOverlay');o.classList.add('hidden');o.setAttribute('aria-busy','false');setTimeout(()=>o.style.display='none',180)}
    function loadForms(){showLoader();google.script.run.withSuccessHandler(forms=>{cachedForms=forms||[];renderRecent(cachedForms);hideLoader()}).withFailureHandler(error=>{console.error(error);hideLoader();recentFormsEl.innerHTML='<div class="empty">Formuláře se nepodařilo načíst.</div>'}).getHomeFormSummaries()}
    function renderRecent(forms){recentFormsEl.innerHTML='';const recent=(forms||[]).slice(0,7);if(!recent.length){recentFormsEl.innerHTML='<div class="empty">Zatím nemáš žádný uložený formulář.</div>';return}recent.forEach(form=>{const distributed=Number(form.distributedCount)||0,collected=Number(form.collectedCount)||0;const row=document.createElement('div');row.className='form-row';if(distributed>0)row.classList.add(collected>=distributed?'complete':'collecting');const qr=document.createElement('button');qr.className='form-qr';qr.type='button';qr.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3z"/><path d="M15 14h2v2h-2zM19 14h2v4h-2zM14 19h4v2h-4zM20 20h1v1h-1z"/></svg>';if(form.publishedAt){qr.onclick=e=>{e.stopPropagation();showQr(form)}}else qr.disabled=true;const main=document.createElement('button');main.className='form-main';main.type='button';const title=document.createElement('div');title.className='form-title';title.textContent=form.internalTitle||form.title||'Bez názvu';const meta=document.createElement('div');meta.className='form-meta';const date=document.createElement('span');date.className='form-date';date.textContent=formatDate(form.updatedAt||form.createdAt);meta.appendChild(date);if(distributed>0){const progress=document.createElement('span');progress.className='progress';progress.textContent=collected+'/'+distributed;meta.appendChild(progress)}main.append(title,meta);main.onclick=()=>go('?view=session&form='+encodeURIComponent(form.formId));const actions=document.createElement('div');actions.className='form-actions';const edit=document.createElement('button');edit.className='form-action';edit.type='button';edit.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/></svg>';edit.onclick=e=>{e.stopPropagation();go('?view=editor&form='+encodeURIComponent(form.formId))};const duplicate=document.createElement('button');duplicate.className='form-action';duplicate.type='button';duplicate.innerHTML='<svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>';duplicate.onclick=e=>{e.stopPropagation();duplicate.disabled=true;google.script.run.withSuccessHandler(result=>{duplicate.disabled=false;if(result&&result.formId)go('?view=editor&form='+encodeURIComponent(result.formId));else loadForms()}).withFailureHandler(()=>duplicate.disabled=false).duplicateFormDraft(form.formId)};const remove=document.createElement('button');remove.className='form-action danger';remove.type='button';remove.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></svg>';remove.onclick=e=>{e.stopPropagation();if(!confirm('Opravdu chceš smazat tento formulář?'))return;google.script.run.withSuccessHandler(loadForms).deleteFormDraft(form.formId)};actions.append(edit,duplicate,remove);const card=document.createElement('div');card.className='form-card';card.append(main,actions);row.append(qr,card);recentFormsEl.appendChild(row)})}
    document.getElementById('qrClose').onclick=()=>qrScreen.classList.remove('open');const homeBrand=document.getElementById('homeBrand');homeBrand.onclick=()=>go('?view=home');homeBrand.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go('?view=home')}};document.getElementById('navTemplates').onclick=()=>go('?view=forms');document.getElementById('navData').onclick=()=>go('?view=data');document.getElementById('newForm').onclick=()=>go('?view=editor&new=1');loadForms();
  </script>
