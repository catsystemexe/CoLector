  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182238;background:#f4f6fb;--accent:#7058d9;--accent2:#8f79ea;--line:#e3e7ef;--muted:#748096;--header:76px;--bottom:104px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f6fb}body{overflow-x:hidden}button,input,textarea{font:inherit}button{cursor:pointer}.app-header{position:sticky;top:0;z-index:50;min-height:var(--header);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;background:rgba(255,255,255,.97);border-bottom:1px solid #e6e9f0;box-shadow:0 2px 12px rgba(28,38,64,.05)}.brand-wrap{display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}.brand-mark{width:44px;height:44px;flex:0 0 auto}.brand-mark svg{width:100%;height:100%;display:block}.section-name{font-size:14px;color:#68748a;font-weight:700}.header-nav{display:flex;gap:9px}.nav-btn{width:54px;height:54px;border:1px solid #dde3ec;border-radius:17px;background:#fff;color:#7c8799;display:grid;place-items:center;padding:0}.nav-btn svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.8}.nav-btn.active{background:linear-gradient(145deg,#8f79ea,#7058d9);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(112,88,217,.22)}main{width:min(100%,620px);margin:0 auto;padding:18px 14px 126px}.section-head{position:sticky;top:var(--header);z-index:35;display:flex;align-items:center;gap:16px;min-height:88px;margin:-18px -2px 16px;padding:14px 18px;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 24px 24px;box-shadow:0 8px 24px rgba(26,37,62,.055)}.section-head-icon{width:58px;height:58px;color:var(--accent);display:grid;place-items:center;flex:0 0 auto}.section-head-icon svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:1.75}.section-head-title{font-size:21px;font-weight:850;color:#27334a}.template-list{display:grid;gap:8px}.template-row{min-height:76px;display:grid;grid-template-columns:46px minmax(0,1fr);gap:6px;align-items:center}.template-side{width:40px;height:40px;border:0;border-radius:12px;background:#f0ebff;color:#7058d9;display:grid;place-items:center;padding:0}.template-side svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}.template-card{min-height:70px;background:#fff;border:1px solid #eceef4;border-radius:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;overflow:hidden}.template-main{height:100%;border:0;background:transparent;text-align:left;padding:11px 8px 11px 14px;color:#27334a;min-width:0}.template-title{font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.template-meta{margin-top:5px;display:flex;gap:9px;color:var(--muted);font-size:12px}.template-actions{display:flex;align-items:center;padding-right:4px}.icon-btn{width:34px;height:36px;border:0;border-radius:10px;background:transparent;color:#657086;display:grid;place-items:center;padding:0}.icon-btn:hover{background:#f5f3ff}.icon-btn.danger{color:#c54c56}.icon-btn.danger:hover{background:#fff0f1}.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9}.empty{padding:24px 18px;background:#fff;border:1px solid var(--line);border-radius:16px;color:var(--muted);text-align:center}.bottom-dock{position:fixed;z-index:40;left:0;right:0;bottom:0;padding:30px 14px max(14px,env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(244,246,251,0),rgba(244,246,251,.95) 28%,#f4f6fb 52%)}.bottom-inner{width:min(100%,620px);margin:0 auto}.primary-purple,.primary-teal{width:100%;min-height:78px;border:0;border-radius:28px;color:#fff;font-size:21px;font-weight:820;display:flex;align-items:center;justify-content:center;gap:10px}.primary-purple{background:linear-gradient(145deg,#8f79ea,#7058d9);box-shadow:0 10px 24px rgba(112,88,217,.24)}.primary-teal{background:linear-gradient(135deg,#12B8B5,#069EAE 55%,#087CA8);box-shadow:0 10px 24px rgba(7,158,174,.22)}.plus{font-size:34px;font-weight:400;line-height:1}
    /* new form chooser */
    .chooser{display:grid;gap:18px}.chooser-card{width:100%;border:1px solid var(--line);border-radius:20px;background:#fff;padding:20px;text-align:left;color:#27334a;box-shadow:0 8px 24px rgba(26,37,62,.05)}.chooser-card.primary{border:0;background:linear-gradient(135deg,#12B8B5,#069EAE 55%,#087CA8);color:#fff}.chooser-title{font-size:20px;font-weight:850}.chooser-copy{margin-top:5px;font-size:13px;opacity:.78}.chooser-list-title{margin:6px 2px 8px;font-weight:850;color:#38445a}.chooser-template{width:100%;min-height:68px;border:1px solid #e8eaf1;border-radius:14px;background:#fff;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;color:#27334a}.chooser-template:hover{background:#faf9ff}.chooser-doc{width:40px;height:40px;border-radius:11px;background:#f0ebff;color:#7058d9;display:grid;place-items:center;flex:0 0 auto}.chooser-doc svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}.chooser-template-title{font-weight:760}.chooser-template-meta{font-size:12px;color:var(--muted);margin-top:3px}
    /* temp editor */
    .editor-shell{display:none}.editor-shell.open{display:block}.library-shell.hidden,.chooser-shell.hidden{display:none}.editor-header{position:sticky;top:0;z-index:60;min-height:68px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 12px;background:#fff;border-bottom:1px solid #e6e9f0}.editor-meta{display:flex;align-items:center;gap:6px;min-width:0}.editor-name{width:100%;border:0;background:transparent;padding:7px 3px;font-weight:760;color:#4c566d;outline:none}.save-dot{width:20px;color:#279263;font-weight:900}.editor-delete{width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:#c54c56;display:grid;place-items:center}.editor-delete svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}.editor-main{width:min(100%,760px);margin:0 auto;padding:18px 12px 138px}.editor-canvas{background:#fff;border-radius:22px;padding:24px 16px 58px;box-shadow:0 10px 30px rgba(26,37,62,.07)}.editable-title,.editable-instructions,.field-title,.option-label{width:100%;border:0;background:transparent;outline:none;color:#27334a}.editable-title{font-size:34px;font-weight:830;color:#aeb6c5;margin-bottom:8px}.editable-title:not(:placeholder-shown){color:#27334a}.editable-instructions{resize:none;min-height:48px;color:#8b94a5;line-height:1.45;margin-bottom:22px}.fields{display:grid;gap:14px}.field-card{position:relative;border:1px solid rgba(132,143,163,.22);border-radius:15px;padding:15px;background:#f5f1fd}.field-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}.field-title{font-size:17px;font-weight:740}.field-actions{display:flex;margin-left:auto}.mini{width:32px;height:32px;border:0;border-radius:9px;background:transparent;color:#7a8498}.mini.danger{color:#c54c56}.field-body textarea{width:100%;min-height:100px;border:1px solid rgba(133,145,165,.24);border-radius:11px;padding:10px;background:rgba(255,255,255,.75)}.checks{display:grid;gap:8px}.check-line{display:flex;align-items:center;gap:8px}.option-label{padding:8px 10px;border:1px solid rgba(133,145,165,.22);border-radius:9px;background:rgba(255,255,255,.72)}.add-option{margin-top:8px;border:1px dashed #c8bfdc;border-radius:9px;background:#fff;color:#7058d9;padding:8px 10px}.yesno{display:grid;grid-template-columns:1fr 1fr;gap:8px}.yesno span{padding:11px;border:1px solid rgba(133,145,165,.22);border-radius:10px;background:#fff;text-align:center;color:#647087}.add-field-wrap{display:flex;justify-content:center;margin-top:22px}.add-field{width:50px;height:50px;border:0;border-radius:50%;background:linear-gradient(145deg,#8f79ea,#7058d9);color:#fff;font-size:28px;box-shadow:0 8px 20px rgba(112,88,217,.25)}.add-field-menu{display:none;grid-template-columns:1fr;gap:6px;margin:10px auto 0;max-width:220px}.add-field-menu.open{display:grid}.add-field-menu button{border:0;border-radius:10px;background:#f4f1fb;color:#4d4564;padding:10px}.editor-bottom{position:fixed;z-index:55;left:50%;bottom:8px;transform:translateX(-50%);width:min(620px,calc(100% - 14px));display:grid;grid-template-columns:1fr 1.25fr;gap:10px;padding:10px;background:rgba(255,255,255,.97);border:1px solid #e3e7ef;border-radius:20px;box-shadow:0 12px 34px rgba(23,34,59,.16)}.editor-action{min-height:64px;border:0;border-radius:15px;background:#f4f1fb;color:#5b4e7d;font-weight:760}.editor-action.use{background:linear-gradient(135deg,#12B8B5,#069EAE 55%,#087CA8);color:#fff}.preview{display:none;position:fixed;z-index:90;inset:0;background:#fff;padding:24px 16px 100px;overflow:auto}.preview.open{display:block}.preview-close{position:fixed;top:14px;right:14px;width:42px;height:42px;border:0;border-radius:11px;background:#f1f3f8}.preview-inner{width:min(100%,620px);margin:40px auto 0}.preview-field{padding:14px;border-radius:13px;background:#f5f1fd;margin-bottom:12px}.loading-line{padding:20px;text-align:center;color:var(--muted)}
    @media(max-width:520px){:root{--header:72px}.brand-mark{width:40px;height:40px}.section-name{font-size:12px}.nav-btn{width:50px;height:50px;border-radius:15px}.nav-btn svg{width:25px;height:25px}.header-nav{gap:7px}.section-head{min-height:84px}.section-head-title{font-size:20px}.editor-name{font-size:13px}.editable-title{font-size:30px}}

<body>
  <div id="libraryShell" class="library-shell">
    <header class="app-header">
      <div id="homeBrand" class="brand-wrap" role="link" tabindex="0">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 256 256"><defs><linearGradient id="brandG" x1="20%" y1="10%" x2="85%" y2="90%"><stop offset="0%" stop-color="#12B8B5"/><stop offset="52%" stop-color="#069EAE"/><stop offset="100%" stop-color="#087CA8"/></linearGradient></defs><rect x="16" y="16" width="224" height="224" rx="48" fill="url(#brandG)"/><path d="M128 69 L180 99 Q186 103 180 107 L128 137 L76 107 Q70 103 76 99 Z" fill="#fff"/><path d="M78 126 L128 155 L178 126 L178 140 L128 169 L78 140 Z" fill="#fff"/><path d="M78 151 L128 180 L178 151 L178 165 L128 194 L78 165 Z" fill="#fff"/></svg></div>
        <span class="section-name">/ Templates</span>
      </div>
      <nav class="header-nav">
        <button id="navHome" class="nav-btn" title="Formuláře" aria-label="Formuláře"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4"/><path d="M9 11h6M9 15h6"/></svg></button>
        <button class="nav-btn active" title="Šablony" aria-label="Šablony"><svg viewBox="0 0 24 24"><path d="M7 3h8l3 3v15H7z"/><path d="M15 3v4h4"/></svg></button>
        <button id="navData" class="nav-btn" title="Data" aria-label="Data"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>

    </header>
    <main>
      <div class="section-head"><div class="section-head-icon"><svg viewBox="0 0 24 24"><path d="M7 3h8l3 3v15H7z"/><path d="M15 3v4h4"/></svg></div><div class="section-head-title">Moje šablony</div></div>
      <div id="templateList" class="template-list"><div class="loading-line">Načítám šablony…</div></div>
    </main>
    <div class="bottom-dock"><div class="bottom-inner"><button id="newTemplate" class="primary-purple"><span class="plus">＋</span><span>Nová šablona</span></button></div></div>
  </div>

  <div id="chooserShell" class="chooser-shell hidden">
    <header class="app-header"><div class="brand-wrap" id="chooserHome"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 256 256"><defs><linearGradient id="brandG2" x1="20%" y1="10%" x2="85%" y2="90%"><stop offset="0%" stop-color="#12B8B5"/><stop offset="52%" stop-color="#069EAE"/><stop offset="100%" stop-color="#087CA8"/></linearGradient></defs><rect x="16" y="16" width="224" height="224" rx="48" fill="url(#brandG2)"/><path d="M128 69 L180 99 Q186 103 180 107 L128 137 L76 107 Q70 103 76 99 Z" fill="#fff"/><path d="M78 126 L128 155 L178 126 L178 140 L128 169 L78 140 Z" fill="#fff"/><path d="M78 151 L128 180 L178 151 L178 165 L128 194 L78 165 Z" fill="#fff"/></svg></div><span class="section-name">/ New form</span></div></header>
    <main class="chooser"><button id="blankForm" class="chooser-card primary"><div class="chooser-title">＋ Prázdný formulář</div><div class="chooser-copy">Začít od nuly v Editoru.</div></button><div><div class="chooser-list-title">Ze šablony</div><div id="chooserTemplates" class="template-list"><div class="loading-line">Načítám šablony…</div></div></div></main>
  </div>

  <div id="editorShell" class="editor-shell">
    <header class="editor-header"><div id="editorHome" class="brand-wrap"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 256 256"><defs><linearGradient id="brandG3" x1="20%" y1="10%" x2="85%" y2="90%"><stop offset="0%" stop-color="#12B8B5"/><stop offset="52%" stop-color="#069EAE"/><stop offset="100%" stop-color="#087CA8"/></linearGradient></defs><rect x="16" y="16" width="224" height="224" rx="48" fill="url(#brandG3)"/><path d="M128 69 L180 99 Q186 103 180 107 L128 137 L76 107 Q70 103 76 99 Z" fill="#fff"/><path d="M78 126 L128 155 L178 126 L178 140 L128 169 L78 140 Z" fill="#fff"/><path d="M78 151 L128 180 L178 151 L178 165 L128 194 L78 165 Z" fill="#fff"/></svg></div><span class="section-name">/ Temp editor</span></div><div class="editor-meta"><span id="saveDot" class="save-dot">✓</span><input id="templateName" class="editor-name" value="Nová šablona" aria-label="Název šablony"></div><button id="deleteTemplate" class="editor-delete" title="Smazat"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></svg></button></header>
    <div class="editor-main"><div class="editor-canvas"><input id="publicTitle" class="editable-title" placeholder="Název formuláře"><textarea id="instructions" class="editable-instructions" placeholder="Instrukce"></textarea><div id="fields" class="fields"></div><div class="add-field-wrap"><button id="addField" class="add-field">＋</button></div><div id="addFieldMenu" class="add-field-menu"><button data-type="textarea">Textová odpověď</button><button data-type="checkbox">Výběr možností</button><button data-type="yes_no">Ano / Ne</button></div></div></div>
    <div class="editor-bottom"><button id="previewBtn" class="editor-action">Preview</button><button id="useTemplate" class="editor-action use">Použít jako nový formulář</button></div>
  </div>

  <div id="preview" class="preview"><button id="previewClose" class="preview-close">×</button><div id="previewInner" class="preview-inner"></div></div>

  <script>
    const APP_URL=<?!= JSON.stringify(appUrl) ?>;
    const libraryShell=document.getElementById('libraryShell'),chooserShell=document.getElementById('chooserShell'),editorShell=document.getElementById('editorShell');
    const go=q=>window.top.location.href=APP_URL+q;
    const fmt=v=>{if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('cs-CZ',{day:'numeric',month:'numeric',year:'numeric'}).format(d)};
    const uid=p=>p+'_'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2));
    let currentTemplateId='',saveTimer=null,state=null;

    function showLibrary(){libraryShell.classList.remove('hidden');chooserShell.classList.add('hidden');editorShell.classList.remove('open');loadTemplates();}
    function showChooser(){libraryShell.classList.add('hidden');chooserShell.classList.remove('hidden');editorShell.classList.remove('open');loadChooserTemplates();}
    function showEditor(){libraryShell.classList.add('hidden');chooserShell.classList.add('hidden');editorShell.classList.add('open');}

    function loadTemplates(){google.script.run.withSuccessHandler(renderTemplates).withFailureHandler(()=>document.getElementById('templateList').innerHTML='<div class="empty">Šablony se nepodařilo načíst.</div>').listTemplates();}
    function renderTemplates(items){const root=document.getElementById('templateList');root.innerHTML='';if(!(items||[]).length){root.innerHTML='<div class="empty">Zatím nemáš žádnou šablonu.</div>';return}(items||[]).forEach(item=>{const row=document.createElement('div');row.className='template-row';const side=document.createElement('button');side.className='template-side';side.innerHTML='<svg viewBox="0 0 24 24"><path d="M7 3h8l3 3v15H7z"/><path d="M15 3v4h4"/></svg>';side.onclick=()=>openEditor(item.templateId);const card=document.createElement('div');card.className='template-card';const main=document.createElement('button');main.className='template-main';main.innerHTML='<div class="template-title"></div><div class="template-meta"><span>'+fmt(item.updatedAt)+'</span><span>'+(item.fieldCount||0)+' polí</span></div>';main.querySelector('.template-title').textContent=item.internalTitle||item.title||'Bez názvu';main.onclick=()=>openEditor(item.templateId);const actions=document.createElement('div');actions.className='template-actions';const edit=icon('Upravit','<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',()=>openEditor(item.templateId));const dup=icon('Duplikovat','<svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',()=>google.script.run.withSuccessHandler(loadTemplates).duplicateTemplateDraft(item.templateId));const del=icon('Smazat','<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14"/></svg>',()=>{if(confirm('Smazat tuto šablonu?'))google.script.run.withSuccessHandler(loadTemplates).deleteTemplateDraft(item.templateId)},true);actions.append(edit,dup,del);card.append(main,actions);row.append(side,card);root.append(row)});}
    function icon(title,html,fn,danger){const b=document.createElement('button');b.className='icon-btn'+(danger?' danger':'');b.title=title;b.innerHTML=html;b.onclick=fn;return b;}

    function loadChooserTemplates(){google.script.run.withSuccessHandler(items=>{const root=document.getElementById('chooserTemplates');root.innerHTML='';if(!(items||[]).length){root.innerHTML='<div class="empty">Nemáš uložené žádné šablony.</div>';return}(items||[]).forEach(item=>{const b=document.createElement('button');b.className='chooser-template';b.innerHTML='<span class="chooser-doc"><svg viewBox="0 0 24 24"><path d="M7 3h8l3 3v15H7z"/><path d="M15 3v4h4"/></svg></span><span><div class="chooser-template-title"></div><div class="chooser-template-meta">'+(item.fieldCount||0)+' polí</div></span>';b.querySelector('.chooser-template-title').textContent=item.internalTitle||item.title||'Bez názvu';b.onclick=()=>createFormFrom(item.templateId,b);root.append(b)});}).listTemplates();}
    function createFormFrom(id,button){if(button)button.disabled=true;google.script.run.withSuccessHandler(r=>{if(r&&r.formId)go('?view=editor&form='+encodeURIComponent(r.formId));else if(button)button.disabled=false}).withFailureHandler(e=>{if(button)button.disabled=false;alert((e&&e.message)||'Formulář se nepodařilo vytvořit.')}).createFormFromTemplate(id);}

    function blankTemplate(){return{version:2,internalTitle:'Nová šablona',title:'',instructions:'',fields:[{id:uid('field'),type:'textarea',label:'',required:false,height:115,accent:'purple'}]};}
    function openEditor(id){showEditor();currentTemplateId=id||uid('tpl');if(id){google.script.run.withSuccessHandler(r=>{state=r&&r.schema?r.schema:blankTemplate();currentTemplateId=r&&r.templateId?r.templateId:currentTemplateId;hydrate();}).withFailureHandler(e=>alert((e&&e.message)||'Šablonu se nepodařilo načíst.')).getTemplateDraft(id)}else{state=blankTemplate();hydrate();scheduleSave();}}
    function hydrate(){state=state||blankTemplate();state.fields=Array.isArray(state.fields)?state.fields:[];document.getElementById('templateName').value=state.internalTitle||'Nová šablona';document.getElementById('publicTitle').value=state.title||'';document.getElementById('instructions').value=state.instructions||'';renderFields();renderPreview();setSaved(true);}
    function scheduleSave(){clearTimeout(saveTimer);setSaved(false);saveTimer=setTimeout(saveNow,650);}
    function saveNow(){if(!state)return;state.internalTitle=document.getElementById('templateName').value||'Nová šablona';state.title=document.getElementById('publicTitle').value||'';state.instructions=document.getElementById('instructions').value||'';google.script.run.withSuccessHandler(()=>setSaved(true)).withFailureHandler(()=>setSaved(false)).saveTemplateDraft({templateId:currentTemplateId,schema:state});}
    function setSaved(ok){document.getElementById('saveDot').textContent=ok?'✓':'…';document.getElementById('saveDot').style.color=ok?'#279263':'#8f79ea';}
    function renderFields(){const root=document.getElementById('fields');root.innerHTML='';state.fields.forEach(field=>{const card=document.createElement('div');card.className='field-card';const head=document.createElement('div');head.className='field-head';const title=document.createElement('input');title.className='field-title';title.placeholder='Nadpis';title.value=field.label||'';title.oninput=()=>{field.label=title.value;scheduleSave();renderPreview()};const acts=document.createElement('div');acts.className='field-actions';const color=document.createElement('button');color.className='mini';color.textContent='◉';color.title='Barva';color.onclick=()=>{cycleAccent(field);renderFields();scheduleSave();renderPreview()};const del=document.createElement('button');del.className='mini danger';del.textContent='×';del.title='Smazat';del.onclick=()=>{state.fields=state.fields.filter(f=>f.id!==field.id);renderFields();scheduleSave();renderPreview()};acts.append(color,del);head.append(title,acts);const body=document.createElement('div');body.className='field-body';if(field.type==='textarea'){const ta=document.createElement('textarea');ta.disabled=true;body.append(ta)}else if(field.type==='checkbox'){field.options=Array.isArray(field.options)&&field.options.length?field.options:[{id:uid('opt'),label:'Možnost 1'}];const checks=document.createElement('div');checks.className='checks';field.options.forEach(opt=>{const line=document.createElement('div');line.className='check-line';const box=document.createElement('span');box.textContent='☐';const input=document.createElement('input');input.className='option-label';input.value=opt.label||'';input.oninput=()=>{opt.label=input.value;scheduleSave();renderPreview()};const x=document.createElement('button');x.className='mini danger';x.textContent='×';x.onclick=()=>{field.options=field.options.filter(o=>o.id!==opt.id);renderFields();scheduleSave();renderPreview()};line.append(box,input,x);checks.append(line)});const add=document.createElement('button');add.className='add-option';add.textContent='+ možnost';add.onclick=()=>{field.options.push({id:uid('opt'),label:'Nová možnost'});renderFields();scheduleSave();renderPreview()};body.append(checks,add)}else{const yn=document.createElement('div');yn.className='yesno';yn.innerHTML='<span>Ano</span><span>Ne</span>';body.append(yn)}card.style.background=fieldBg(field.accent);card.append(head,body);root.append(card)});}
    function cycleAccent(field){const a=['blue','green','purple','orange','red'];field.accent=a[(a.indexOf(field.accent)+1+a.length)%a.length]||'purple';}
    function fieldBg(a){return({blue:'#eef3ff',green:'#edf8f0',purple:'#f4effb',orange:'#fff4e8',red:'#fceff1'})[a]||'#f4effb';}
    function renderPreview(){const root=document.getElementById('previewInner');if(!state)return;root.innerHTML='<h1></h1><p></p><div id="pFields"></div>';root.querySelector('h1').textContent=document.getElementById('publicTitle').value||'Název formuláře';root.querySelector('p').textContent=document.getElementById('instructions').value||'';const pf=root.querySelector('#pFields');state.fields.forEach(f=>{const d=document.createElement('div');d.className='preview-field';d.style.background=fieldBg(f.accent);const t=document.createElement('strong');t.textContent=f.label||'Položka';d.append(t);if(f.type==='checkbox'){const list=document.createElement('div');(f.options||[]).forEach(o=>{const x=document.createElement('div');x.textContent='☐ '+(o.label||'');list.append(x)});d.append(list)}else if(f.type==='yes_no'){const x=document.createElement('div');x.textContent='Ano   /   Ne';d.append(x)}else{const x=document.createElement('div');x.style.minHeight='62px';x.style.marginTop='8px';x.style.background='rgba(255,255,255,.65)';x.style.borderRadius='9px';d.append(x)}pf.append(d)});}

    document.getElementById('homeBrand').onclick=()=>go('?view=home');document.getElementById('navHome').onclick=()=>go('?view=home');document.getElementById('navData').onclick=()=>go('?view=data');document.getElementById('newTemplate').onclick=()=>openEditor('');document.getElementById('chooserHome').onclick=()=>go('?view=home');document.getElementById('blankForm').onclick=()=>go('?view=editor&new=1');document.getElementById('editorHome').onclick=showLibrary;
    document.getElementById('templateName').oninput=()=>{state.internalTitle=document.getElementById('templateName').value;scheduleSave()};document.getElementById('publicTitle').oninput=()=>{state.title=document.getElementById('publicTitle').value;scheduleSave();renderPreview()};document.getElementById('instructions').oninput=()=>{state.instructions=document.getElementById('instructions').value;scheduleSave();renderPreview()};
    document.getElementById('addField').onclick=()=>document.getElementById('addFieldMenu').classList.toggle('open');document.querySelectorAll('#addFieldMenu button').forEach(b=>b.onclick=()=>{const type=b.dataset.type;const f={id:uid('field'),type,label:'',required:false,accent:'purple'};if(type==='checkbox')f.options=[{id:uid('opt'),label:'Možnost 1'},{id:uid('opt'),label:'Možnost 2'}];state.fields.push(f);document.getElementById('addFieldMenu').classList.remove('open');renderFields();scheduleSave();renderPreview()});
    document.getElementById('previewBtn').onclick=()=>{renderPreview();document.getElementById('preview').classList.add('open')};document.getElementById('previewClose').onclick=()=>document.getElementById('preview').classList.remove('open');document.getElementById('useTemplate').onclick=()=>{saveNow();setTimeout(()=>createFormFrom(currentTemplateId),250)};document.getElementById('deleteTemplate').onclick=()=>{if(!currentTemplateId||!confirm('Smazat tuto šablonu?'))return;google.script.run.withSuccessHandler(showLibrary).deleteTemplateDraft(currentTemplateId)};

    google.script.url.getLocation(loc=>{const p=(loc&&loc.parameter)||{};if(p.mode==='new-form'){showChooser();return}if(p.mode==='editor'){openEditor(p.template||'');return}showLibrary();});
  </script>
</body>
</html>
