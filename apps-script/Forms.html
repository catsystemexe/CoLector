<!doctype html>
<html lang="cs">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CoLector — Moje formuláře</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182238;background:#f4f6fb;--line:#e4e8f0;--muted:#748096}*{box-sizing:border-box}body{margin:0;background:#f4f6fb}.app-header{position:sticky;top:0;z-index:20;min-height:62px;display:flex;align-items:center;gap:10px;padding:9px 14px;background:rgba(255,255,255,.97);border-bottom:1px solid #e6e9f0;box-shadow:0 2px 12px rgba(28,38,64,.05)}button{font:inherit;cursor:pointer}.back{width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:#5f6b82;font-size:24px}.back:hover{background:#f2f4f9}.brand-mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#506fea,#7658d8);color:#fff;font-weight:900}.brand{font-weight:850;font-size:18px}.section-name{color:#6d778b;font-size:14px;margin-left:3px}main{width:min(100%,620px);margin:0 auto;padding:22px 14px 60px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(26,37,62,.055);overflow:hidden}.form-row{width:100%;min-height:72px;border:0;border-bottom:1px solid #edf0f5;background:#fff;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 16px;text-align:left;color:#27334a}.form-row:last-child{border-bottom:0}.form-row:hover{background:#fafbfe}.form-title{font-weight:740;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.form-date{margin-top:4px;color:var(--muted);font-size:13px}.chevron{color:#98a2b4;font-size:24px}.empty{padding:22px 16px;color:var(--muted);font-size:14px}.loading{padding:22px 16px;color:var(--muted);font-size:14px}@media(min-width:760px){.app-header{min-height:68px;padding:10px 20px}.brand{font-size:19px}main{padding-top:38px}}
  </style>
</head>
<body>
  <header class="app-header"><button id="back" class="back" type="button" aria-label="Zpět">‹</button><div class="brand-mark">C</div><div><span class="brand">CoLector</span><span class="section-name"> / Moje formuláře</span></div></header>
  <main><section class="card"><div id="forms"><div class="loading">Načítám formuláře…</div></div></section></main>
  <script>
    const APP_URL=<?!= JSON.stringify(appUrl) ?>;
    const formsEl=document.getElementById('forms');
    function go(query){window.top.location.href=APP_URL+query}
    function formatDate(value){if(!value)return'';const d=new Date(value);if(Number.isNaN(d.getTime()))return'';return new Intl.DateTimeFormat('cs-CZ',{day:'numeric',month:'numeric',year:'numeric'}).format(d)}
    function render(forms){formsEl.innerHTML='';if(!(forms||[]).length){formsEl.innerHTML='<div class="empty">Zatím nemáš žádný uložený formulář.</div>';return}(forms||[]).forEach(form=>{const row=document.createElement('button');row.className='form-row';row.type='button';const copy=document.createElement('span');const title=document.createElement('div');title.className='form-title';title.textContent=form.internalTitle||form.title||'Bez názvu';const date=document.createElement('div');date.className='form-date';date.textContent=formatDate(form.updatedAt||form.createdAt);copy.append(title,date);const chevron=document.createElement('span');chevron.className='chevron';chevron.textContent='›';row.append(copy,chevron);row.onclick=()=>go('?view=editor&form='+encodeURIComponent(form.formId));formsEl.append(row)})}
    function fail(){formsEl.innerHTML='<div class="empty">Formuláře se nepodařilo načíst.</div>'}
    document.getElementById('back').onclick=()=>go('?view=home');
    google.script.run.withSuccessHandler(render).withFailureHandler(fail).listFormDrafts();
  </script>
</body>
</html>
