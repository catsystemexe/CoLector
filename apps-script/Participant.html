<!doctype html>
<html lang="cs">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CoLector — Formulář</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182238;background:#f4f6fb;--accent:#3f61e8;--line:#dfe4ee;--muted:#748096}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:#f4f6fb}.top{height:58px;display:flex;align-items:center;padding:8px 14px;background:#fff;border-bottom:1px solid #e6e9f0}.brand{display:flex;align-items:center;gap:9px;font-weight:850;color:#27334a}.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#506fea,#7658d8);color:#fff;font-weight:900}main{width:min(100%,680px);margin:0 auto;padding:18px 12px 48px}.sheet{background:#fff;border:1px solid #e6e9f0;border-radius:20px;padding:22px 16px 28px;box-shadow:0 10px 30px rgba(26,37,62,.06)}h1{margin:0 0 8px;font-size:clamp(28px,7vw,42px);line-height:1.08;color:#27334a}.instructions{margin:0 0 24px;color:#6f7a8f;line-height:1.5;white-space:pre-wrap}.fields{display:grid;gap:16px}.field{border:1px solid rgba(133,145,165,.18);border-radius:15px;padding:15px}.field-title{display:block;font-weight:760;margin-bottom:10px;color:#2d374b}.field textarea{width:100%;min-height:120px;resize:vertical;border:1px solid rgba(133,145,165,.28);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;background:rgba(255,255,255,.82);color:#2e3748;outline:none}.field textarea:focus{border-color:#8395e7;box-shadow:0 0 0 3px rgba(63,97,232,.10)}.checks{display:grid;gap:10px}.check{display:flex;align-items:center;gap:10px;min-height:42px;padding:8px 10px;border:1px solid rgba(133,145,165,.23);border-radius:10px;background:rgba(255,255,255,.72)}.check input{width:20px;height:20px;flex:0 0 auto}.yesno{display:grid;grid-template-columns:1fr 1fr;gap:10px}.yesno input{position:absolute;opacity:0;pointer-events:none}.yesno label{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid rgba(133,145,165,.28);border-radius:12px;background:rgba(255,255,255,.75);font-weight:720;color:#566176;cursor:pointer}.yesno input:checked+label{border-color:#6479e6;background:#eef1ff;color:#3f55c3;box-shadow:0 0 0 2px rgba(63,97,232,.08)}.submit-wrap{margin-top:22px;display:grid;gap:10px}.submit{width:100%;min-height:54px;border:0;border-radius:13px;background:linear-gradient(135deg,#506fea,#7159d8);color:#fff;font:inherit;font-weight:820;font-size:16px;cursor:pointer;box-shadow:0 8px 20px rgba(63,97,232,.22)}.submit:disabled{opacity:.55;cursor:default;box-shadow:none}.submit-state{text-align:center;min-height:20px;color:#6f7a8f;font-size:14px}.submit-state.success{color:#25865d;font-weight:700}.submit-state.error{color:#b44350}.state{padding:28px 18px;text-align:center;color:#748096}.state strong{display:block;color:#334057;font-size:18px;margin-bottom:6px}.accent-blue{background:#f2f5ff}.accent-green{background:#f0f8f4}.accent-purple{background:#f6f1fb}.accent-orange{background:#fff5e9}.accent-red{background:#fff0f1}@media(min-width:760px){main{padding-top:34px}.sheet{padding:34px 32px 40px}.field{padding:18px}.checks.columns-2{grid-template-columns:repeat(2,minmax(0,1fr))}.checks.columns-3{grid-template-columns:repeat(3,minmax(0,1fr))}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><span class="mark">C</span><span>CoLector</span></div></header>
  <main><section id="sheet" class="sheet"><div class="state">Načítám formulář…</div></section></main>
  <script>
    const FORM_ID=<?!= JSON.stringify(formId) ?>;
    const TEAM_KEY='colector.team.id';
    const sheet=document.getElementById('sheet');
    let currentSchema=null;
    function makeId(prefix){return prefix+'_'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2))}
    function getTeamId(){try{let id=localStorage.getItem(TEAM_KEY);if(!id){id=makeId('team');localStorage.setItem(TEAM_KEY,id)}return id}catch(e){return makeId('team')}}
    function safeAccent(value){return['blue','green','purple','orange','red'].includes(value)?value:'blue'}
    function fieldTitle(field){if(!field.label)return null;const el=document.createElement('div');el.className='field-title';el.textContent=field.label;return el}
    function renderField(field){
      const wrap=document.createElement('section');wrap.className='field accent-'+safeAccent(field.accent);wrap.dataset.fieldId=field.id||'';wrap.dataset.fieldType=field.type||'';
      const title=fieldTitle(field);if(title)wrap.appendChild(title);
      if(field.type==='textarea'){
        const textarea=document.createElement('textarea');textarea.name=field.id||'';textarea.style.minHeight=Math.max(100,Number(field.height)||115)+'px';wrap.appendChild(textarea);return wrap;
      }
      if(field.type==='checkbox'){
        const checks=document.createElement('div');const columns=[1,2,3].includes(Number(field.columns))?Number(field.columns):1;checks.className='checks columns-'+columns;
        (field.options||[]).forEach(option=>{const label=document.createElement('label');label.className='check';const input=document.createElement('input');input.type='checkbox';input.name=field.id||'';input.value=option.id||option.label||'';const text=document.createElement('span');text.textContent=option.label||'';label.append(input,text);checks.appendChild(label)});wrap.appendChild(checks);return wrap;
      }
      if(field.type==='yes_no'){
        const group=document.createElement('div');group.className='yesno';['Ano','Ne'].forEach((labelText,index)=>{const input=document.createElement('input');input.type='radio';input.name=field.id||'';input.id=(field.id||'yesno')+'_'+index;input.value=index===0?'yes':'no';const label=document.createElement('label');label.htmlFor=input.id;label.textContent=labelText;group.append(input,label)});wrap.appendChild(group);return wrap;
      }
      return null;
    }
    function collectAnswers(){
      const answers={};
      (currentSchema.fields||[]).forEach(field=>{
        if(!field.id)return;
        if(field.type==='textarea'){
          const el=sheet.querySelector('textarea[name="'+CSS.escape(field.id)+'"]');answers[field.id]=el?el.value:'';
        }else if(field.type==='checkbox'){
          answers[field.id]=Array.from(sheet.querySelectorAll('input[type="checkbox"][name="'+CSS.escape(field.id)+'"]:checked')).map(el=>el.value);
        }else if(field.type==='yes_no'){
          const el=sheet.querySelector('input[type="radio"][name="'+CSS.escape(field.id)+'"]:checked');answers[field.id]=el?el.value:'';
        }
      });
      return answers;
    }
    function render(result){
      if(!result||!result.schema){sheet.innerHTML='<div class="state"><strong>Formulář není dostupný</strong>Formulář zatím nebyl publikován nebo už neexistuje.</div>';return}
      currentSchema=result.schema;sheet.innerHTML='';
      if(currentSchema.title){const h=document.createElement('h1');h.textContent=currentSchema.title;sheet.appendChild(h)}
      if(currentSchema.instructions){const p=document.createElement('p');p.className='instructions';p.textContent=currentSchema.instructions;sheet.appendChild(p)}
      const fields=document.createElement('div');fields.className='fields';(currentSchema.fields||[]).forEach(field=>{const rendered=renderField(field);if(rendered)fields.appendChild(rendered)});sheet.appendChild(fields);
      const wrap=document.createElement('div');wrap.className='submit-wrap';const button=document.createElement('button');button.type='button';button.className='submit';button.textContent='Odeslat';const status=document.createElement('div');status.className='submit-state';wrap.append(button,status);sheet.appendChild(wrap);
      button.onclick=()=>{
        button.disabled=true;button.textContent='Odesílám…';status.className='submit-state';status.textContent='';
        const payload={formId:FORM_ID,teamId:getTeamId(),responseId:makeId('response'),answers:collectAnswers()};
        google.script.run.withSuccessHandler(result=>{button.textContent='Odesláno';status.className='submit-state success';status.textContent=(result&&result.teamLabel?result.teamLabel+': ':'')+'odpověď byla uložena.'}).withFailureHandler(error=>{button.disabled=false;button.textContent='Odeslat';status.className='submit-state error';status.textContent=(error&&error.message)||'Odeslání se nepodařilo.'}).submitParticipantResponse(payload);
      };
    }
    function fail(){sheet.innerHTML='<div class="state"><strong>Formulář se nepodařilo načíst</strong>Zkuste stránku obnovit.</div>'}
    if(!FORM_ID){fail()}else{google.script.run.withSuccessHandler(render).withFailureHandler(fail).getPublishedForm(FORM_ID)}
  </script>
</body>
</html>
