<!doctype html>
<html lang="cs">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CoLector — Editor</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182238;background:#f4f6fb;--accent:#3f61e8;--line:#dfe4ee;--danger:#c54c56;--success:#279263;--header-height:68px}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:#f4f6fb}button,input,textarea{font:inherit}button{cursor:pointer}.app-header{position:sticky;top:0;z-index:50;min-height:var(--header-height);display:grid;grid-template-columns:auto minmax(180px,1fr) auto;gap:18px;align-items:center;padding:10px 20px;background:rgba(255,255,255,.97);border-bottom:1px solid #e6e9f0;box-shadow:0 2px 12px rgba(28,38,64,.05)}.brand-wrap{display:flex;align-items:center;gap:10px;white-space:nowrap}.brand-mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#506fea,#7658d8);color:#fff;font-weight:900}.brand{font-weight:850;font-size:19px}.section-name{color:#6d778b;font-size:14px;margin-left:3px}.internal-title{min-width:0;border:0;background:transparent;color:#485267;padding:8px 10px;border-radius:9px;outline:none}.internal-title:hover,.internal-title:focus{background:#f4f6fb}.header-actions{display:flex;align-items:center;gap:8px}.header-btn,.save-status{min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:10px;padding:8px 10px;background:transparent;color:#59647a}.header-btn:hover{background:#f2f4f9}.header-btn[disabled]{opacity:.42;cursor:default}.save-status{color:var(--success);font-weight:750}.header-btn svg,.save-status svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9}main{max-width:920px;margin:0 auto;padding:46px 18px 88px}.editor-canvas{position:relative;min-height:600px;background:#fff;border-radius:24px;padding:38px 44px 70px;box-shadow:0 12px 38px rgba(26,37,62,.08)}.editable-title,.editable-instructions,.field-title,.option-label{border:0;background:transparent;outline:none;width:100%;padding:0;color:#1d273a}.editable-title{font-size:clamp(30px,5vw,50px);font-weight:820;letter-spacing:-.035em;color:#aeb6c5;margin-bottom:10px}.editable-title:not(:placeholder-shown){color:#27334a}.editable-instructions{min-height:28px;resize:none;overflow:hidden;color:#8b94a5;font-size:16px;line-height:1.5;margin-bottom:30px}.editable-title::placeholder,.editable-instructions::placeholder,.field-title::placeholder,.option-label::placeholder{color:#b1b8c6;opacity:1}.fields{display:grid;gap:18px}.field-card{position:relative;border:1px solid var(--line);border-radius:16px;padding:18px 46px 18px 18px;background:#fff;transition:.15s}.field-card:hover{border-color:#cbd3e2;box-shadow:0 7px 20px rgba(29,42,70,.06)}.field-card.dragging{opacity:.55}.field-card.drag-over{border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,97,232,.10)}.field-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}.field-title{font-size:18px;font-weight:720;color:#2d374b;min-width:0}.field-mini-actions{display:flex;align-items:center;gap:3px;margin-left:auto}.icon-btn{width:34px;height:34px;border:0;border-radius:9px;background:transparent;display:grid;place-items:center;color:#7a8498}.icon-btn:hover{background:#f3f5f9}.icon-btn.danger:hover{background:#fff0f1;color:var(--danger)}.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}.accent-dot{width:15px;height:15px;border-radius:50%;background:var(--field-accent,#8ea0d8);border:2px solid #fff;box-shadow:0 0 0 1px #cbd2df}.drag-handle{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;min-height:54px;border:0;border-radius:10px;background:transparent;color:#a5adbb;display:grid;place-items:center;cursor:grab}.drag-handle:hover{background:#f3f5f9;color:#737d91}.drag-dots{width:12px;height:26px;background-image:radial-gradient(circle,currentColor 1.5px,transparent 1.6px);background-size:6px 6px}.field-body textarea{width:100%;min-height:115px;resize:vertical;border:1px solid #d5dbe6;border-radius:12px;padding:13px 14px;outline:none;background:#fbfcfe;color:#5e687c}.checkbox-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:12px;color:#7b8598;font-size:13px}.segmented{display:inline-flex;border:1px solid #d9deea;border-radius:9px;overflow:hidden;background:#fff}.segmented button{min-width:34px;height:30px;border:0;border-right:1px solid #e5e9f1;background:#fff;color:#657086}.segmented button:last-child{border-right:0}.segmented button.active{background:var(--accent);color:#fff}.checkbox-grid,.preview-checkbox-grid{display:grid;gap:10px}.check-item{display:flex;align-items:center;gap:9px;min-height:42px;border:1px solid #e1e5ee;border-radius:10px;padding:8px 10px;background:#fbfcfe}.check-item input[type="checkbox"]{width:18px;height:18px;flex:0 0 auto}.option-label{font-size:14px}.option-delete{width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:#a2aabc;font-size:18px}.option-delete:hover{background:#fff0f1;color:var(--danger)}.add-option-inline{margin-top:10px;border:1px dashed #cfd6e4;border-radius:10px;background:#fff;color:#667187;padding:8px 12px}.yesno-row,.preview-yesno{display:grid;grid-template-columns:1fr 1fr;gap:10px}.yesno-choice{border:1px solid #dfe4ee;border-radius:11px;background:#fbfcfe;padding:12px 14px;color:#4f5a70;text-align:left}.placeholder-line{min-height:72px;border:1px dashed #d5dbe6;border-radius:12px;display:grid;place-items:center;color:#9aa3b3;background:#fbfcfe}.add-wrap{position:relative;display:grid;place-items:center;margin-top:28px}.add-button{width:48px;height:48px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 8px 18px rgba(63,97,232,.28)}.add-menu{display:none;position:absolute;top:56px;z-index:20;min-width:190px;background:#fff;border:1px solid #e1e5ee;border-radius:13px;box-shadow:0 14px 32px rgba(24,35,60,.14);padding:7px}.add-menu.open{display:grid}.add-option{border:0;background:transparent;border-radius:9px;padding:10px 12px;text-align:left;color:#344056}.add-option:hover{background:#f3f5f9}.preview-drawer{position:fixed;z-index:40;top:var(--header-height);right:0;bottom:0;width:min(520px,92vw);background:#fff;border-left:1px solid #e4e8f0;box-shadow:-16px 0 40px rgba(23,34,59,.14);transform:translateX(104%);transition:transform .24s ease;display:flex;flex-direction:column}.preview-drawer.open{transform:translateX(0)}.preview-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #eceff4}.preview-content{overflow:auto;padding:24px 24px 100px}.preview-content h2{margin:0 0 8px;font-size:30px}.preview-content p{margin:0 0 24px;color:#727d91;line-height:1.5}.preview-field{margin-bottom:20px}.preview-field>label{display:block;font-weight:700;margin-bottom:8px}.preview-input{width:100%;min-height:106px;border:1px solid #d5dbe6;border-radius:12px;background:#fbfcfe}.preview-check{display:flex;align-items:center;gap:8px;min-height:38px}.preview-check input{width:18px;height:18px}.preview-footer{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 50px;gap:10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid #e8ebf1}.submit-preview{border:0;border-radius:11px;background:var(--accent);color:#fff;font-weight:800}.qr-preview{border:1px solid #d9deea;border-radius:11px;background:#fff;font-size:20px}.backdrop{position:fixed;z-index:35;inset:var(--header-height) 0 0;background:rgba(19,27,45,.16);opacity:0;pointer-events:none;transition:opacity .2s}.backdrop.open{opacity:1;pointer-events:auto}@media(max-width:760px){:root{--header-height:62px}.app-header{grid-template-columns:auto 1fr auto;padding:8px 10px;gap:8px}.brand{font-size:17px}.section-name{display:none}.brand-mark{width:34px;height:34px}.internal-title{font-size:13px;padding:7px 5px}.header-actions{gap:2px}.header-btn,.save-status{width:38px;min-height:38px;padding:0}.header-btn span,.save-status span{display:none}main{padding:16px 10px 70px}.editor-canvas{border-radius:18px;padding:24px 16px 60px}.field-card{padding:15px 42px 15px 14px}.preview-drawer{width:100vw;border-left:0}.backdrop{display:none}.checkbox-grid{grid-template-columns:1fr!important}.checkbox-toolbar{justify-content:flex-start;flex-wrap:wrap}}
  </style>
</head>
<body>
<header class="app-header"><div class="brand-wrap"><div class="brand-mark">C</div><div><span class="brand">CoLector</span><span class="section-name"> / Editor</span></div></div><input id="internalTitle" class="internal-title" value="Nový formulář" aria-label="Interní název formuláře"><div class="header-actions"><div id="saveStatus" class="save-status" title="Draft uložen"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3"/><path d="m9 15 2 2 4-4"/></svg><span>Uloženo</span></div><button id="previewButton" class="header-btn" type="button"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg><span>Preview</span></button><button class="header-btn" disabled><span>Publikovat</span></button><button class="header-btn" disabled><span>QR</span></button></div></header>
<main><section class="editor-canvas"><input id="formTitle" class="editable-title" type="text" placeholder="Nadpis formuláře"><textarea id="formInstructions" class="editable-instructions" rows="1" placeholder="Klikněte a napište instrukci"></textarea><div id="fields" class="fields"></div><div class="add-wrap"><button id="addButton" class="add-button" type="button">+</button><div id="addMenu" class="add-menu"><button class="add-option" data-type="textarea">Textové pole</button><button class="add-option" data-type="checkbox">Checkbox</button><button class="add-option" data-type="yes_no">Ano / Ne</button></div></div></section></main>
<div id="backdrop" class="backdrop"></div><aside id="previewDrawer" class="preview-drawer" aria-hidden="true"><div class="preview-head"><strong>Preview formuláře</strong><button id="closePreview" class="icon-btn">✕</button></div><div id="previewContent" class="preview-content"></div><div class="preview-footer"><button class="submit-preview">Odeslat</button><button class="qr-preview" disabled>▦</button></div></aside>
<script>
const STORAGE_KEY='colector.editor.draft.v2';
const state=loadDraft()||{version:2,internalTitle:'Nový formulář',title:'',instructions:'',fields:[{id:createId('field'),type:'textarea',label:'',required:false,height:115,accent:'blue'}]};
const fieldsEl=document.getElementById('fields'),internalTitleEl=document.getElementById('internalTitle'),titleEl=document.getElementById('formTitle'),instructionsEl=document.getElementById('formInstructions'),saveStatusEl=document.getElementById('saveStatus'),addButton=document.getElementById('addButton'),addMenu=document.getElementById('addMenu'),previewDrawer=document.getElementById('previewDrawer'),previewContent=document.getElementById('previewContent'),backdrop=document.getElementById('backdrop');let saveTimer=null,draggedId=null;
internalTitleEl.value=state.internalTitle||'Nový formulář';titleEl.value=state.title||'';instructionsEl.value=state.instructions||'';normalizeLoadedState();autoSizeInstructions();
function createId(prefix){return prefix+'_'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2))}
function loadDraft(){try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw):null}catch(e){return null}}
function normalizeLoadedState(){state.fields=(state.fields||[]).map(f=>{if(f.type==='checkbox'){f.columns=[1,2,3].includes(Number(f.columns))?Number(f.columns):1;f.options=Array.isArray(f.options)&&f.options.length?f.options:[{id:createId('opt'),label:'Možnost 1'},{id:createId('opt'),label:'Možnost 2'}]}return f})}
function scheduleSave(){clearTimeout(saveTimer);saveStatusEl.querySelector('span').textContent='Ukládám…';saveTimer=setTimeout(()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(buildSchema()));saveStatusEl.querySelector('span').textContent='Uloženo'}catch(e){saveStatusEl.querySelector('span').textContent='Chyba'}},650)}
function buildSchema(){return{version:2,internalTitle:state.internalTitle,title:state.title,instructions:state.instructions,fields:state.fields.map(f=>({...f,options:f.options?f.options.map(o=>({...o})):undefined}))}}
function accentColor(n){return({blue:'#6f85dc',green:'#58a57c',purple:'#9877cf',orange:'#d89b55',red:'#cb6f79',gray:'#9aa4b5'})[n]||'#6f85dc'}
function iconButton(title,html,handler,danger=false){const b=document.createElement('button');b.className='icon-btn'+(danger?' danger':'');b.type='button';b.title=title;b.innerHTML=html;b.onclick=handler;return b}
function renderEditor(){fieldsEl.innerHTML='';state.fields.forEach(field=>{const card=document.createElement('article');card.className='field-card';card.dataset.id=field.id;card.draggable=true;card.style.setProperty('--field-accent',accentColor(field.accent));const head=document.createElement('div');head.className='field-head';const title=document.createElement('input');title.className='field-title';title.placeholder='Nadpis';title.value=field.label||'';title.oninput=()=>{field.label=title.value;scheduleSave();renderPreview()};const actions=document.createElement('div');actions.className='field-mini-actions';actions.append(iconButton('Barva','<span class="accent-dot"></span>',()=>cycleAccent(field)),iconButton('Smazat','<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>',()=>deleteField(field.id),true));head.append(title,actions);const body=document.createElement('div');body.className='field-body';if(field.type==='textarea')renderTextarea(field,body);else if(field.type==='checkbox')renderCheckboxEditor(field,body);else renderYesNo(body);const drag=document.createElement('button');drag.className='drag-handle';drag.type='button';drag.innerHTML='<span class="drag-dots"></span>';drag.title='Přesunout položku';card.addEventListener('dragstart',e=>{if(!e.target.closest('.drag-handle')){e.preventDefault();return}draggedId=field.id;card.classList.add('dragging');e.dataTransfer.setData('text/plain',field.id)});card.addEventListener('dragend',()=>{draggedId=null;card.classList.remove('dragging');document.querySelectorAll('.field-card').forEach(el=>el.classList.remove('drag-over'))});card.addEventListener('dragover',e=>{if(!draggedId||draggedId===field.id)return;e.preventDefault();card.classList.add('drag-over')});card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));card.addEventListener('drop',e=>{e.preventDefault();reorderFields(draggedId,field.id)});card.append(head,body,drag);fieldsEl.append(card)})}
function renderTextarea(field,body){const ta=document.createElement('textarea');ta.placeholder='Text';ta.style.height=Math.max(80,Number(field.height)||115)+'px';const remember=()=>{field.height=Math.min(500,Math.max(80,Math.round(ta.getBoundingClientRect().height)));scheduleSave();renderPreview()};ta.onmouseup=remember;ta.ontouchend=remember;body.append(ta)}
function renderCheckboxEditor(field,body){const toolbar=document.createElement('div');toolbar.className='checkbox-toolbar';toolbar.append(document.createTextNode('Na řádek:'));const seg=document.createElement('div');seg.className='segmented';[1,2,3].forEach(n=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.className=Number(field.columns)===n?'active':'';b.onclick=()=>{field.columns=n;scheduleSave();renderEditor();renderPreview()};seg.append(b)});toolbar.append(seg);const grid=document.createElement('div');grid.className='checkbox-grid';grid.style.gridTemplateColumns=`repeat(${field.columns||1},minmax(0,1fr))`;field.options.forEach(opt=>{const item=document.createElement('div');item.className='check-item';const box=document.createElement('input');box.type='checkbox';box.disabled=true;const input=document.createElement('input');input.className='option-label';input.value=opt.label||'';input.placeholder='Text';input.oninput=()=>{opt.label=input.value;scheduleSave();renderPreview()};const del=document.createElement('button');del.type='button';del.className='option-delete';del.textContent='×';del.title='Smazat možnost';del.onclick=()=>{field.options=field.options.filter(o=>o.id!==opt.id);scheduleSave();renderEditor();renderPreview()};item.append(box,input,del);grid.append(item)});const add=document.createElement('button');add.type='button';add.className='add-option-inline';add.textContent='+ Přidat možnost';add.onclick=()=>{field.options.push({id:createId('opt'),label:'Nová možnost'});scheduleSave();renderEditor();renderPreview()};body.append(toolbar,grid,add)}
function renderYesNo(body){const row=document.createElement('div');row.className='yesno-row';['Ano','Ne'].forEach(t=>{const b=document.createElement('button');b.type='button';b.className='yesno-choice';b.textContent='○  '+t;b.disabled=true;row.append(b)});body.append(row)}
function cycleAccent(field){const p=['blue','green','purple','orange','red','gray'];field.accent=p[(p.indexOf(field.accent)+1+p.length)%p.length];scheduleSave();renderEditor();renderPreview()}
function deleteField(id){const f=state.fields.find(x=>x.id===id),label=f&&f.label?' „'+f.label+'“':'';if(!confirm('Opravdu chcete smazat tuto položku'+label+'?'))return;state.fields=state.fields.filter(x=>x.id!==id);scheduleSave();renderEditor();renderPreview()}
function reorderFields(sourceId,targetId){if(!sourceId||sourceId===targetId)return;const from=state.fields.findIndex(x=>x.id===sourceId),to=state.fields.findIndex(x=>x.id===targetId);if(from<0||to<0)return;const[item]=state.fields.splice(from,1);state.fields.splice(to,0,item);scheduleSave();renderEditor();renderPreview()}
function addField(type){state.fields.push({id:createId('field'),type,label:'',required:false,height:type==='textarea'?115:undefined,accent:'blue',columns:type==='checkbox'?1:undefined,options:type==='checkbox'?[{id:createId('opt'),label:'Možnost 1'},{id:createId('opt'),label:'Možnost 2'}]:undefined});addMenu.classList.remove('open');scheduleSave();renderEditor();renderPreview()}
function renderPreview(){previewContent.innerHTML='';const h=document.createElement('h2');h.textContent=state.title||'Nadpis formuláře';const p=document.createElement('p');p.textContent=state.instructions||'';previewContent.append(h,p);state.fields.forEach(field=>{const wrap=document.createElement('div');wrap.className='preview-field';const label=document.createElement('label');label.textContent=field.label||'Nadpis';wrap.append(label);if(field.type==='textarea'){const fake=document.createElement('div');fake.className='preview-input';fake.style.minHeight=Math.max(80,Number(field.height)||115)+'px';wrap.append(fake)}else if(field.type==='checkbox'){const grid=document.createElement('div');grid.className='preview-checkbox-grid';grid.style.gridTemplateColumns=`repeat(${field.columns||1},minmax(0,1fr))`;field.options.forEach(opt=>{const row=document.createElement('label');row.className='preview-check';const box=document.createElement('input');box.type='checkbox';row.append(box,document.createTextNode(opt.label||'Text'));grid.append(row)});wrap.append(grid)}else{const row=document.createElement('div');row.className='preview-yesno';['Ano','Ne'].forEach(t=>{const c=document.createElement('label');c.className='preview-check';const r=document.createElement('input');r.type='radio';r.name='preview_'+field.id;c.append(r,document.createTextNode(t));row.append(c)});wrap.append(row)}previewContent.append(wrap)})}
function openPreview(){renderPreview();previewDrawer.classList.add('open');backdrop.classList.add('open');previewDrawer.setAttribute('aria-hidden','false')}function closePreview(){previewDrawer.classList.remove('open');backdrop.classList.remove('open');previewDrawer.setAttribute('aria-hidden','true')}function autoSizeInstructions(){instructionsEl.style.height='auto';instructionsEl.style.height=Math.max(28,instructionsEl.scrollHeight)+'px'}
internalTitleEl.oninput=()=>{state.internalTitle=internalTitleEl.value;scheduleSave()};titleEl.oninput=()=>{state.title=titleEl.value;scheduleSave();renderPreview()};instructionsEl.oninput=()=>{state.instructions=instructionsEl.value;autoSizeInstructions();scheduleSave();renderPreview()};addButton.onclick=e=>{e.stopPropagation();addMenu.classList.toggle('open')};addMenu.onclick=e=>{const b=e.target.closest('[data-type]');if(b)addField(b.dataset.type)};document.addEventListener('click',e=>{if(!e.target.closest('.add-wrap'))addMenu.classList.remove('open')});document.getElementById('previewButton').onclick=openPreview;document.getElementById('closePreview').onclick=closePreview;backdrop.onclick=closePreview;document.addEventListener('keydown',e=>{if(e.key==='Escape')closePreview()});renderEditor();renderPreview();scheduleSave();
</script>
</body></html>
