<script>
const STORAGE_KEY='colector.editor.draft.v3';
const LEGACY_STORAGE_KEY='colector.editor.draft.v2';
const FORM_CACHE_PREFIX='colector.editor.form.v1.';
const ROUTE_FORM_ID=String(window.COLECTOR_ROUTE_FORM_ID||'');
const ROUTE_NEW=window.COLECTOR_ROUTE_NEW===true;
const state=loadDraft()||{version:3,formId:createId('form'),internalTitle:'Nový formulář',rounds:[createRound(true)]};
if(!state.formId)state.formId=createId('form');

const roundsRoot=document.getElementById('roundsRoot');
const internalTitleEl=document.getElementById('internalTitle');
const titleEl=document.getElementById('formTitle');
const instructionsEl=document.getElementById('formInstructions');
const saveStatusEl=document.getElementById('saveStatus');
const previewDrawer=document.getElementById('previewDrawer');
const previewContent=document.getElementById('previewContent');
const backdrop=document.getElementById('backdrop');
let saveTimer=null,draggedField=null,saveGeneration=0,previewRoundIndex=0;

function createId(prefix){return prefix+'_'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2))}
function createField(type='textarea'){const field={id:createId('field'),type:type,label:'',required:false,height:115,accent:'blue'};if(type==='checkbox')field.options=[{id:createId('opt'),label:'Možnost 1'},{id:createId('opt'),label:'Možnost 2'}];return field}
function createRound(first){return{id:first?'round_1':createId('round'),title:'',instructions:'',fields:[createField('textarea')]}}
function readFormCacheRecord(formId){
  if(!formId)return null;
  try{
    const raw=localStorage.getItem(FORM_CACHE_PREFIX+formId);
    if(!raw)return null;
    const parsed=JSON.parse(raw);
    return parsed&&parsed.schema&&String(parsed.schema.formId||'')===String(formId)?parsed:null;
  }catch(e){return null}
}
function writeFormCache(schema,savedAt){
  if(!schema||!schema.formId)return;
  try{localStorage.setItem(FORM_CACHE_PREFIX+schema.formId,JSON.stringify({schema:schema,savedAt:Number(savedAt)||Date.now()}))}catch(e){}
}
function clearFormCache(formId){
  if(!formId)return;
  try{localStorage.removeItem(FORM_CACHE_PREFIX+formId)}catch(e){}
}
function loadDraft(){
  try{
    if(ROUTE_NEW)return null;
    if(ROUTE_FORM_ID){
      const cached=readFormCacheRecord(ROUTE_FORM_ID);
      if(cached&&cached.schema)return cached.schema;
      return {version:3,formId:ROUTE_FORM_ID,internalTitle:'Načítám…',rounds:[createRound(true)]};
    }
    const raw=localStorage.getItem(STORAGE_KEY)||localStorage.getItem(LEGACY_STORAGE_KEY);
    return raw?JSON.parse(raw):null;
  }catch(e){return null}
}

function normalizeField(field){
  field=field||createField('textarea');
  if(!field.id)field.id=createId('field');
  if(!['textarea','checkbox','yes_no'].includes(field.type))field.type='textarea';
  if(!['blue','green','purple','orange','red'].includes(field.accent))field.accent='blue';
  if(field.type==='checkbox'){
    field.columns=[1,2,3].includes(Number(field.columns))?Number(field.columns):1;
    field.options=Array.isArray(field.options)&&field.options.length?field.options:[{id:createId('opt'),label:'Možnost 1'},{id:createId('opt'),label:'Možnost 2'}];
    field.options=field.options.map(option=>({id:option.id||createId('opt'),label:String(option.label||'')}));
  }
  return field;
}

function normalizeLoadedState(){
  const source=Array.isArray(state.rounds)&&state.rounds.length
    ? state.rounds
    : [{id:'round_1',title:state.title||'',instructions:state.instructions||'',fields:Array.isArray(state.fields)?state.fields:[]}];
  state.version=3;
  state.internalTitle=state.internalTitle||'Nový formulář';
  state.rounds=source.map((round,index)=>({
    id:String(round.id||(index===0?'round_1':createId('round'))),
    title:String(round.title||''),
    instructions:String(round.instructions||''),
    fields:(Array.isArray(round.fields)?round.fields:[]).map(normalizeField)
  }));
  if(!state.rounds.length)state.rounds=[createRound(true)];
  syncLegacyAliases();
}

function syncLegacyAliases(){
  const first=state.rounds[0]||createRound(true);
  state.title=first.title||'';
  state.instructions=first.instructions||'';
  state.fields=first.fields||[];
  titleEl.value=state.title;
  instructionsEl.value=state.instructions;
}

function cloneField(field){const copy={...field};if(field.options)copy.options=field.options.map(option=>({...option}));return copy}
function buildSchema(){
  syncLegacyAliases();
  return{
    version:3,
    formId:state.formId,
    internalTitle:state.internalTitle,
    title:state.title,
    instructions:state.instructions,
    fields:state.fields.map(cloneField),
    rounds:state.rounds.map(round=>({id:round.id,title:round.title,instructions:round.instructions,fields:(round.fields||[]).map(cloneField)}))
  };
}

function setSaveStatus(text,mode,title){
  saveStatusEl.querySelector('span').textContent=text;
  saveStatusEl.classList.toggle('saved',mode==='cloud');
  saveStatusEl.classList.toggle('saving',mode==='saving');
  saveStatusEl.classList.toggle('local-only',mode==='local');
  saveStatusEl.classList.toggle('error',mode==='error');
  saveStatusEl.title=title||text;
}
function writeLocalDraft(schema,savedAt){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(schema));
    writeFormCache(schema,savedAt);
    return true;
  }catch(e){return false}
}
function scheduleSave(){
  clearTimeout(saveTimer);
  const generation=++saveGeneration;
  const schema=buildSchema();
  if(!writeLocalDraft(schema,Date.now())){setSaveStatus('Chyba','error','Draft se nepodařilo uložit lokálně');return}
  setSaveStatus('Ukládám…','saving','Ukládám draft');
  saveTimer=setTimeout(()=>persistDraft(generation),1800);
}
function persistDraft(generation){
  const schema=buildSchema();
  if(!writeLocalDraft(schema,Date.now())){if(generation===saveGeneration)setSaveStatus('Chyba','error','Draft se nepodařilo uložit ani lokálně');return}
  if(!(window.google&&google.script&&google.script.run)){if(generation===saveGeneration)setSaveStatus('Lokálně','local','Draft je uložen pouze v tomto prohlížeči');return}
  google.script.run.withSuccessHandler(result=>{
    if(generation!==saveGeneration)return;
    if(result&&result.ok){
      writeFormCache(schema,Date.parse(result.updatedAt||'')||Date.now());
      setSaveStatus('Uloženo','cloud','Draft uložen do Google Sheets');
    }else setSaveStatus('Lokálně','local','Lokální kopie je uložená, cloud nepotvrdil uložení');
  }).withFailureHandler(error=>{
    console.warn('Cloud autosave selhal.',error);
    if(generation===saveGeneration)setSaveStatus('Lokálně','local','Lokální kopie je uložená, cloud autosave selhal');
  }).saveFormDraft({formId:state.formId,schema});
}

function accentColor(n){return({blue:'#7f96d9',green:'#79ad8d',purple:'#a38bc8',orange:'#d5a26e',red:'#d18b91'})[n]||'#7f96d9'}
function fieldBackground(n){return({blue:'#eef3ff',green:'#edf8f0',purple:'#f4effb',orange:'#fff4e8',red:'#fceff1'})[n]||'#eef3ff'}
function iconButton(title,html,handler,danger=false){const b=document.createElement('button');b.className='icon-btn'+(danger?' danger':'');b.type='button';b.title=title;b.innerHTML=html;b.onclick=handler;return b}

function renderTextarea(field,body){
  const ta=document.createElement('textarea');ta.placeholder='Text';ta.style.height=Math.max(80,Number(field.height)||115)+'px';
  const remember=()=>{field.height=Math.min(500,Math.max(80,Math.round(ta.getBoundingClientRect().height)));scheduleSave();renderPreview()};
  ta.onmouseup=remember;ta.ontouchend=remember;body.append(ta);
}
function renderCheckboxEditor(field,body){
  const toolbar=document.createElement('div');toolbar.className='checkbox-toolbar';
  const label=document.createElement('span');label.textContent='Sloupce';
  const segmented=document.createElement('div');segmented.className='segmented';
  [1,2,3].forEach(n=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.classList.toggle('active',Number(field.columns||1)===n);b.onclick=()=>{field.columns=n;renderEditor();scheduleSave();renderPreview()};segmented.append(b)});
  toolbar.append(label,segmented);body.append(toolbar);
  const grid=document.createElement('div');grid.className='checkbox-grid';grid.style.gridTemplateColumns='repeat('+Number(field.columns||1)+',minmax(0,1fr))';
  (field.options||[]).forEach(option=>{
    const item=document.createElement('label');item.className='check-item';
    const box=document.createElement('input');box.type='checkbox';box.disabled=true;
    const input=document.createElement('input');input.className='option-label';input.value=option.label||'';input.placeholder='Možnost';
    input.oninput=()=>{option.label=input.value;scheduleSave();renderPreview()};
    const del=document.createElement('button');del.type='button';del.className='option-delete';del.textContent='×';del.onclick=e=>{e.preventDefault();field.options=field.options.filter(o=>o.id!==option.id);renderEditor();scheduleSave();renderPreview()};
    item.append(box,input,del);grid.append(item);
  });
  body.append(grid);
  const add=document.createElement('button');add.type='button';add.className='add-option-inline';add.textContent='+ možnost';
  add.onclick=()=>{field.options.push({id:createId('opt'),label:'Nová možnost'});renderEditor();scheduleSave();renderPreview()};body.append(add);
}
function renderYesNo(body){const row=document.createElement('div');row.className='yesno-row';['Ano','Ne'].forEach(x=>{const b=document.createElement('button');b.type='button';b.className='yesno-choice';b.textContent=x;b.disabled=true;row.append(b)});body.append(row)}
function cycleAccent(field){const values=['blue','green','purple','orange','red'];field.accent=values[(values.indexOf(field.accent)+1+values.length)%values.length]||'blue';renderEditor();scheduleSave();renderPreview()}
function deleteField(round,fieldId){round.fields=round.fields.filter(field=>field.id!==fieldId);renderEditor();scheduleSave();renderPreview()}
function reorderFields(round,fromId,toId){if(!fromId||fromId===toId)return;const from=round.fields.findIndex(f=>f.id===fromId),to=round.fields.findIndex(f=>f.id===toId);if(from<0||to<0)return;const moved=round.fields.splice(from,1)[0];round.fields.splice(to,0,moved);renderEditor();scheduleSave();renderPreview()}
function addField(round,type){round.fields.push(normalizeField(createField(type)));renderEditor();scheduleSave();renderPreview()}
function addRound(){state.rounds.push(createRound(false));previewRoundIndex=state.rounds.length-1;renderEditor();scheduleSave();renderPreview();setTimeout(()=>{const nodes=document.querySelectorAll('.round-editor');const target=nodes[nodes.length-1];if(target)target.scrollIntoView({behavior:'smooth',block:'start'})},0)}
function deleteRound(roundId){if(state.rounds.length<=1)return;if(!confirm('Smazat tento Part?'))return;state.rounds=state.rounds.filter(round=>round.id!==roundId);previewRoundIndex=Math.min(previewRoundIndex,state.rounds.length-1);syncLegacyAliases();renderEditor();scheduleSave();renderPreview()}

function renderFieldCard(round,field){
  const card=document.createElement('article');card.className='field-card';card.dataset.id=field.id;card.draggable=true;card.style.setProperty('--field-accent',accentColor(field.accent));card.style.background=fieldBackground(field.accent);
  const head=document.createElement('div');head.className='field-head';
  const title=document.createElement('input');title.className='field-title';title.placeholder='Nadpis';title.value=field.label||'';title.oninput=()=>{field.label=title.value;scheduleSave();renderPreview()};
  const actions=document.createElement('div');actions.className='field-mini-actions';
  actions.append(iconButton('Barva','<span class="accent-dot"></span>',()=>cycleAccent(field)),iconButton('Smazat','<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>',()=>deleteField(round,field.id),true));
  head.append(title,actions);
  const body=document.createElement('div');body.className='field-body';
  if(field.type==='textarea')renderTextarea(field,body);else if(field.type==='checkbox')renderCheckboxEditor(field,body);else renderYesNo(body);
  const drag=document.createElement('button');drag.className='drag-handle';drag.type='button';drag.innerHTML='<span class="drag-dots"></span>';drag.title='Přesunout položku';
  drag.onmousedown=()=>{draggedField={roundId:round.id,fieldId:field.id}};
  card.addEventListener('dragstart',e=>{if(!draggedField||draggedField.fieldId!==field.id){e.preventDefault();return}card.classList.add('dragging');e.dataTransfer.setData('text/plain',field.id)});
  card.addEventListener('dragend',()=>{draggedField=null;document.querySelectorAll('.field-card').forEach(el=>el.classList.remove('dragging','drag-over'))});
  card.addEventListener('dragover',e=>{if(!draggedField||draggedField.roundId!==round.id||draggedField.fieldId===field.id)return;e.preventDefault();card.classList.add('drag-over')});
  card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
  card.addEventListener('drop',e=>{e.preventDefault();if(draggedField&&draggedField.roundId===round.id)reorderFields(round,draggedField.fieldId,field.id)});
  card.append(head,body,drag);return card;
}

function renderEditor(){
  syncLegacyAliases();
  const resetButton=document.querySelector('.editor-reset');
  roundsRoot.innerHTML='';
  state.rounds.forEach((round,index)=>{
    const section=document.createElement('section');section.className='editor-canvas round-editor';section.dataset.roundId=round.id;
    const badge=document.createElement('div');badge.className='round-label';badge.textContent='Part '+String.fromCharCode(65+index);section.appendChild(badge);
    if(state.rounds.length>1&&index>0){
      const del=document.createElement('button');del.type='button';del.className='round-delete';del.title='Smazat Part '+String.fromCharCode(65+index);del.setAttribute('aria-label',del.title);del.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></svg>';del.onclick=()=>deleteRound(round.id);section.appendChild(del);
    }
    const title=document.createElement('input');title.className='editable-title';title.type='text';title.placeholder='Nadpis formuláře';title.value=round.title||'';title.oninput=()=>{round.title=title.value;if(index===0)syncLegacyAliases();scheduleSave();renderPreview()};
    const instructions=document.createElement('textarea');instructions.className='editable-instructions';instructions.rows=1;instructions.placeholder='Klikněte a napište instrukci';instructions.value=round.instructions||'';instructions.oninput=()=>{round.instructions=instructions.value;instructions.style.height='auto';instructions.style.height=instructions.scrollHeight+'px';if(index===0)syncLegacyAliases();scheduleSave();renderPreview()};
    section.append(title,instructions);
    const fields=document.createElement('div');fields.className='round-fields';(round.fields||[]).forEach(field=>fields.appendChild(renderFieldCard(round,field)));section.appendChild(fields);
    const addWrap=document.createElement('div');addWrap.className='add-wrap';
    const button=document.createElement('button');button.className='add-button';button.type='button';button.textContent='+';
    const menu=document.createElement('div');menu.className='add-menu';
    [['textarea','Textové pole'],['checkbox','Checkbox'],['yes_no','Ano / Ne']].forEach(item=>{const option=document.createElement('button');option.className='add-option';option.type='button';option.textContent=item[1];option.onclick=()=>{addField(round,item[0]);menu.classList.remove('open')};menu.append(option)});
    if(index===state.rounds.length-1){const divider=document.createElement('div');divider.className='add-menu-divider';menu.append(divider);const newRound=document.createElement('button');newRound.type='button';newRound.className='add-option round-option';newRound.textContent='＋ Nový Part';newRound.onclick=()=>{menu.classList.remove('open');addRound()};menu.append(newRound)}
    button.onclick=e=>{e.stopPropagation();document.querySelectorAll('.add-menu.open').forEach(x=>{if(x!==menu)x.classList.remove('open')});menu.classList.toggle('open')};
    addWrap.append(button,menu);section.append(addWrap);roundsRoot.append(section);
    requestAnimationFrame(()=>{instructions.style.height='auto';instructions.style.height=instructions.scrollHeight+'px'});
  });
  if(resetButton){
    const firstRound=roundsRoot.querySelector('.round-editor');
    if(firstRound)firstRound.appendChild(resetButton);
  }
}

function renderPreview(){
  if(!previewContent)return;
  if(previewRoundIndex>=state.rounds.length)previewRoundIndex=0;
  const round=state.rounds[previewRoundIndex]||state.rounds[0];
  previewContent.innerHTML='';
  if(state.rounds.length>1){
    const tabs=document.createElement('div');tabs.className='preview-round-tabs';
    state.rounds.forEach((item,index)=>{const tab=document.createElement('button');tab.type='button';tab.className='preview-round-tab'+(index===previewRoundIndex?' active':'');tab.textContent='Part '+String.fromCharCode(65+index);tab.onclick=()=>{previewRoundIndex=index;renderPreview()};tabs.append(tab)});
    previewContent.append(tabs);
  }
  const h=document.createElement('h2');h.textContent=round.title||'Nadpis formuláře';previewContent.append(h);
  if(round.instructions){const p=document.createElement('p');p.textContent=round.instructions;previewContent.append(p)}
  (round.fields||[]).forEach(field=>{
    const box=document.createElement('div');box.className='preview-field';box.style.background=fieldBackground(field.accent);
    const label=document.createElement('label');label.textContent=field.label||'Položka';box.append(label);
    if(field.type==='textarea'){const input=document.createElement('div');input.className='preview-input';input.style.minHeight=Math.max(80,Number(field.height)||115)+'px';box.append(input)}
    else if(field.type==='checkbox'){const grid=document.createElement('div');grid.className='preview-checkbox-grid';grid.style.gridTemplateColumns='repeat('+Number(field.columns||1)+',minmax(0,1fr))';(field.options||[]).forEach(option=>{const row=document.createElement('label');row.className='preview-check';const cb=document.createElement('input');cb.type='checkbox';cb.disabled=true;const text=document.createElement('span');text.textContent=option.label||'';row.append(cb,text);grid.append(row)});box.append(grid)}
    else{const yn=document.createElement('div');yn.className='preview-yesno';yn.innerHTML='<button disabled>Ano</button><button disabled>Ne</button>';box.append(yn)}
    previewContent.append(box);
  });
}
function openPreview(){renderPreview();previewDrawer.classList.add('open');previewDrawer.setAttribute('aria-hidden','false');backdrop.classList.add('open')}
function closePreview(){previewDrawer.classList.remove('open');previewDrawer.setAttribute('aria-hidden','true');backdrop.classList.remove('open')}
function autoSizeInstructions(){document.querySelectorAll('.editable-instructions').forEach(el=>{el.style.height='auto';el.style.height=el.scrollHeight+'px'})}

normalizeLoadedState();
internalTitleEl.value=state.internalTitle||'Nový formulář';
renderEditor();
renderPreview();
setSaveStatus('Uloženo','cloud','Draft připraven');

internalTitleEl.oninput=()=>{state.internalTitle=internalTitleEl.value;scheduleSave()};
document.getElementById('previewButton').onclick=openPreview;
document.getElementById('closePreview').onclick=closePreview;
backdrop.onclick=closePreview;
document.addEventListener('click',()=>document.querySelectorAll('.add-menu.open').forEach(menu=>menu.classList.remove('open')));
</script>
</body></html>
