<!doctype html>
<html lang="cs">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CoLector — Editor</title>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #182238;
        background: #f4f6fb;
        --accent: #3f61e8;
        --accent-soft: #eef2ff;
        --muted: #8c96aa;
        --line: #dfe4ee;
        --panel: #ffffff;
        --danger: #c54c56;
        --success: #279263;
        --header-height: 68px;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body { margin: 0; background: #f4f6fb; }
      button, input, textarea { font: inherit; }
      button { cursor: pointer; }

      .app-header {
        position: sticky;
        top: 0;
        z-index: 50;
        min-height: var(--header-height);
        display: grid;
        grid-template-columns: auto minmax(180px, 1fr) auto;
        gap: 18px;
        align-items: center;
        padding: 10px 20px;
        background: rgba(255,255,255,.97);
        border-bottom: 1px solid #e6e9f0;
        box-shadow: 0 2px 12px rgba(28,38,64,.05);
      }
      .brand-wrap { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
      .brand-mark {
        width: 36px; height: 36px; border-radius: 10px;
        display: grid; place-items: center;
        background: linear-gradient(145deg, #506fea, #7658d8);
        color: #fff; font-weight: 900; letter-spacing: -.06em;
      }
      .brand { font-weight: 850; font-size: 19px; }
      .section-name { color: #6d778b; font-size: 14px; margin-left: 3px; }
      .internal-title {
        min-width: 0;
        border: 0;
        background: transparent;
        color: #485267;
        padding: 8px 10px;
        border-radius: 9px;
        outline: none;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .internal-title:hover, .internal-title:focus { background: #f4f6fb; }
      .header-actions { display: flex; align-items: center; gap: 8px; }
      .header-btn, .save-status {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 8px 10px;
        background: transparent;
        color: #59647a;
      }
      .header-btn:hover { background: #f2f4f9; }
      .header-btn[disabled] { opacity: .42; cursor: default; }
      .save-status { color: var(--success); font-weight: 750; cursor: default; }
      .header-btn svg, .save-status svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; }

      main { max-width: 920px; margin: 0 auto; padding: 46px 18px 88px; }
      .editor-canvas {
        position: relative;
        min-height: 600px;
        background: var(--panel);
        border-radius: 24px;
        padding: 38px 44px 70px;
        box-shadow: 0 12px 38px rgba(26,37,62,.08);
      }
      .editable-title, .editable-instructions, .field-title {
        border: 0;
        background: transparent;
        outline: none;
        width: 100%;
        padding: 0;
        color: #1d273a;
      }
      .editable-title {
        font-size: clamp(30px, 5vw, 50px);
        font-weight: 820;
        letter-spacing: -.035em;
        color: #aeb6c5;
        margin-bottom: 10px;
      }
      .editable-title:not(:placeholder-shown) { color: #27334a; }
      .editable-instructions {
        min-height: 28px;
        resize: none;
        overflow: hidden;
        color: #8b94a5;
        font-size: 16px;
        line-height: 1.5;
        margin-bottom: 30px;
      }
      .editable-title::placeholder, .editable-instructions::placeholder, .field-title::placeholder { color: #b1b8c6; opacity: 1; }

      .fields { display: grid; gap: 18px; }
      .field-card {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 46px 18px 18px;
        background: #fff;
        transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
      }
      .field-card:hover { border-color: #cbd3e2; box-shadow: 0 7px 20px rgba(29,42,70,.06); }
      .field-card.dragging { opacity: .55; transform: scale(.995); }
      .field-card.drag-over { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(63,97,232,.10); }
      .field-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .field-title {
        font-size: 18px;
        font-weight: 720;
        color: #2d374b;
        min-width: 0;
      }
      .field-mini-actions { display: flex; align-items: center; gap: 3px; margin-left: auto; }
      .icon-btn {
        width: 34px; height: 34px;
        border: 0; border-radius: 9px;
        background: transparent;
        display: grid; place-items: center;
        color: #7a8498;
      }
      .icon-btn:hover { background: #f3f5f9; }
      .icon-btn.danger:hover { background: #fff0f1; color: var(--danger); }
      .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
      .accent-dot { width: 15px; height: 15px; border-radius: 50%; background: var(--field-accent, #8ea0d8); border: 2px solid #fff; box-shadow: 0 0 0 1px #cbd2df; }

      .drag-handle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 28px;
        min-height: 54px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #a5adbb;
        display: grid;
        place-items: center;
        cursor: grab;
        touch-action: none;
      }
      .drag-handle:hover { background: #f3f5f9; color: #737d91; }
      .drag-handle:active { cursor: grabbing; }
      .drag-dots { width: 12px; height: 26px; opacity: .9; background-image: radial-gradient(circle, currentColor 1.5px, transparent 1.6px); background-size: 6px 6px; }

      .field-body textarea {
        width: 100%; min-height: 115px; resize: vertical;
        border: 1px solid #d5dbe6; border-radius: 12px;
        padding: 13px 14px; outline: none; background: #fbfcfe;
        color: #5e687c;
      }
      .field-body textarea:focus { border-color: #aab7e9; box-shadow: 0 0 0 3px rgba(63,97,232,.08); }
      .placeholder-line { min-height: 72px; border: 1px dashed #d5dbe6; border-radius: 12px; display: grid; place-items: center; color: #9aa3b3; background: #fbfcfe; }

      .add-wrap { position: relative; display: grid; place-items: center; margin-top: 28px; }
      .add-button {
        width: 48px; height: 48px; border: 0; border-radius: 50%;
        background: var(--accent); color: #fff; font-size: 28px; line-height: 1;
        box-shadow: 0 8px 18px rgba(63,97,232,.28);
      }
      .add-menu {
        display: none;
        position: absolute;
        top: 56px;
        z-index: 20;
        min-width: 190px;
        background: #fff;
        border: 1px solid #e1e5ee;
        border-radius: 13px;
        box-shadow: 0 14px 32px rgba(24,35,60,.14);
        padding: 7px;
      }
      .add-menu.open { display: grid; }
      .add-option {
        border: 0; background: transparent; border-radius: 9px;
        padding: 10px 12px; text-align: left; color: #344056;
      }
      .add-option:hover { background: #f3f5f9; }

      .preview-drawer {
        position: fixed;
        z-index: 40;
        top: var(--header-height);
        right: 0;
        bottom: 0;
        width: min(520px, 92vw);
        background: #fff;
        border-left: 1px solid #e4e8f0;
        box-shadow: -16px 0 40px rgba(23,34,59,.14);
        transform: translateX(104%);
        transition: transform .24s ease;
        display: flex;
        flex-direction: column;
      }
      .preview-drawer.open { transform: translateX(0); }
      .preview-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid #eceff4; }
      .preview-head strong { font-size: 18px; }
      .preview-content { overflow: auto; padding: 24px 24px 100px; }
      .preview-content h2 { margin: 0 0 8px; font-size: 30px; }
      .preview-content p { margin: 0 0 24px; color: #727d91; line-height: 1.5; }
      .preview-field { margin-bottom: 18px; }
      .preview-field label { display: block; font-weight: 700; margin-bottom: 8px; }
      .preview-input { width: 100%; min-height: 106px; border: 1px solid #d5dbe6; border-radius: 12px; background: #fbfcfe; }
      .preview-footer {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        display: grid;
        grid-template-columns: 1fr 50px;
        gap: 10px;
        padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
        background: rgba(255,255,255,.97);
        border-top: 1px solid #e8ebf1;
      }
      .submit-preview { border: 0; border-radius: 11px; background: var(--accent); color: #fff; font-weight: 800; }
      .qr-preview { border: 1px solid #d9deea; border-radius: 11px; background: #fff; font-size: 20px; }

      .backdrop {
        position: fixed; z-index: 35; inset: var(--header-height) 0 0 0;
        background: rgba(19,27,45,.16);
        opacity: 0; pointer-events: none; transition: opacity .2s ease;
      }
      .backdrop.open { opacity: 1; pointer-events: auto; }

      @media (max-width: 760px) {
        :root { --header-height: 62px; }
        .app-header { grid-template-columns: auto 1fr auto; padding: 8px 10px; gap: 8px; }
        .brand { font-size: 17px; }
        .section-name { display: none; }
        .brand-mark { width: 34px; height: 34px; }
        .internal-title { font-size: 13px; padding: 7px 5px; }
        .header-actions { gap: 2px; }
        .header-btn, .save-status { width: 38px; min-height: 38px; padding: 0; }
        .header-btn span, .save-status span { display: none; }
        main { padding: 16px 10px 70px; }
        .editor-canvas { border-radius: 18px; padding: 24px 16px 60px; }
        .field-card { padding: 15px 42px 15px 14px; }
        .preview-drawer { width: 100vw; border-left: 0; }
        .backdrop { display: none; }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand-wrap">
        <div class="brand-mark" aria-hidden="true">C</div>
        <div><span class="brand">CoLector</span><span class="section-name"> / Editor</span></div>
      </div>
      <input id="internalTitle" class="internal-title" value="Nový formulář" aria-label="Interní název formuláře">
      <div class="header-actions">
        <div id="saveStatus" class="save-status" title="Draft uložen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3"/><path d="m9 15 2 2 4-4"/></svg>
          <span>Uloženo</span>
        </div>
        <button id="previewButton" class="header-btn" type="button" title="Preview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg>
          <span>Preview</span>
        </button>
        <button class="header-btn" type="button" title="Publikovat" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 14v6h14v-6"/></svg>
          <span>Publikovat</span>
        </button>
        <button class="header-btn" type="button" title="QR" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path d="M14 14h2v2h-2zM18 14h2v4h-2zM14 18h4v2h-4z"/></svg>
          <span>QR</span>
        </button>
      </div>
    </header>

    <main>
      <section class="editor-canvas">
        <input id="formTitle" class="editable-title" type="text" placeholder="Nadpis formuláře" value="">
        <textarea id="formInstructions" class="editable-instructions" rows="1" placeholder="Klikněte a napište instrukci"></textarea>

        <div id="fields" class="fields"></div>

        <div class="add-wrap">
          <button id="addButton" class="add-button" type="button" aria-label="Přidat položku">+</button>
          <div id="addMenu" class="add-menu">
            <button class="add-option" type="button" data-type="textarea">Textové pole</button>
            <button class="add-option" type="button" data-type="checkbox">Checkbox</button>
            <button class="add-option" type="button" data-type="yes_no">Ano / Ne</button>
          </div>
        </div>
      </section>
    </main>

    <div id="backdrop" class="backdrop"></div>
    <aside id="previewDrawer" class="preview-drawer" aria-hidden="true">
      <div class="preview-head">
        <strong>Preview formuláře</strong>
        <button id="closePreview" class="icon-btn" type="button" aria-label="Zavřít preview">✕</button>
      </div>
      <div id="previewContent" class="preview-content"></div>
      <div class="preview-footer">
        <button class="submit-preview" type="button">Odeslat</button>
        <button class="qr-preview" type="button" title="Offline QR" disabled>▦</button>
      </div>
    </aside>

    <script>
      const STORAGE_KEY = 'colector.editor.draft.v2';
      const state = loadDraft() || {
        version: 2,
        internalTitle: 'Nový formulář',
        title: '',
        instructions: '',
        fields: [
          { id: createId('field'), type: 'textarea', label: '', required: false, height: 115, accent: 'blue' }
        ]
      };

      const fieldsEl = document.getElementById('fields');
      const internalTitleEl = document.getElementById('internalTitle');
      const titleEl = document.getElementById('formTitle');
      const instructionsEl = document.getElementById('formInstructions');
      const saveStatusEl = document.getElementById('saveStatus');
      const addButton = document.getElementById('addButton');
      const addMenu = document.getElementById('addMenu');
      const previewDrawer = document.getElementById('previewDrawer');
      const previewContent = document.getElementById('previewContent');
      const backdrop = document.getElementById('backdrop');
      let saveTimer = null;
      let draggedId = null;

      internalTitleEl.value = state.internalTitle || 'Nový formulář';
      titleEl.value = state.title || '';
      instructionsEl.value = state.instructions || '';
      autoSizeInstructions();

      function createId(prefix) {
        if (window.crypto && crypto.randomUUID) return prefix + '_' + crypto.randomUUID();
        return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      }

      function loadDraft() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (error) {
          console.warn('Draft nelze načíst.', error);
          return null;
        }
      }

      function scheduleSave() {
        clearTimeout(saveTimer);
        saveStatusEl.querySelector('span').textContent = 'Ukládám…';
        saveStatusEl.title = 'Ukládám draft';
        saveTimer = setTimeout(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(buildSchema()));
            saveStatusEl.querySelector('span').textContent = 'Uloženo';
            saveStatusEl.title = 'Draft uložen';
          } catch (error) {
            saveStatusEl.querySelector('span').textContent = 'Chyba';
            saveStatusEl.title = 'Draft se nepodařilo uložit';
          }
        }, 650);
      }

      function buildSchema() {
        return {
          version: 2,
          internalTitle: state.internalTitle,
          title: state.title,
          instructions: state.instructions,
          fields: state.fields.map(field => ({ ...field }))
        };
      }

      function renderEditor() {
        fieldsEl.innerHTML = '';
        state.fields.forEach(field => {
          const card = document.createElement('article');
          card.className = 'field-card';
          card.dataset.id = field.id;
          card.draggable = true;
          card.style.setProperty('--field-accent', accentColor(field.accent));

          const head = document.createElement('div');
          head.className = 'field-head';

          const title = document.createElement('input');
          title.className = 'field-title';
          title.type = 'text';
          title.placeholder = 'Nadpis';
          title.value = field.label || '';
          title.addEventListener('input', () => {
            field.label = title.value;
            scheduleSave();
            renderPreview();
          });

          const actions = document.createElement('div');
          actions.className = 'field-mini-actions';
          actions.append(
            iconButton('Barva', paletteIcon(), () => cycleAccent(field)),
            iconButton('Smazat', trashIcon(), () => deleteField(field.id), true)
          );

          head.append(title, actions);

          const body = document.createElement('div');
          body.className = 'field-body';
          if (field.type === 'textarea') {
            const textarea = document.createElement('textarea');
            textarea.placeholder = 'Text';
            textarea.style.height = Math.max(80, Number(field.height) || 115) + 'px';
            textarea.addEventListener('mouseup', () => rememberHeight(field, textarea));
            textarea.addEventListener('touchend', () => rememberHeight(field, textarea));
            body.appendChild(textarea);
          } else if (field.type === 'checkbox') {
            const placeholder = document.createElement('div');
            placeholder.className = 'placeholder-line';
            placeholder.textContent = 'Checkbox — nastavení možností přijde v dalším kroku';
            body.appendChild(placeholder);
          } else {
            const placeholder = document.createElement('div');
            placeholder.className = 'placeholder-line';
            placeholder.textContent = 'Ano     /     Ne';
            body.appendChild(placeholder);
          }

          const drag = document.createElement('button');
          drag.className = 'drag-handle';
          drag.type = 'button';
          drag.title = 'Přesunout položku';
          drag.setAttribute('aria-label', 'Přesunout položku');
          drag.innerHTML = '<span class="drag-dots"></span>';
          drag.addEventListener('mousedown', () => card.draggable = true);
          drag.addEventListener('touchstart', () => card.draggable = true, { passive: true });

          card.addEventListener('dragstart', event => {
            if (!event.target.closest('.drag-handle')) {
              event.preventDefault();
              return;
            }
            draggedId = field.id;
            card.classList.add('dragging');
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', field.id);
          });
          card.addEventListener('dragend', () => {
            draggedId = null;
            card.classList.remove('dragging');
            document.querySelectorAll('.field-card').forEach(el => el.classList.remove('drag-over'));
          });
          card.addEventListener('dragover', event => {
            if (!draggedId || draggedId === field.id) return;
            event.preventDefault();
            card.classList.add('drag-over');
          });
          card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
          card.addEventListener('drop', event => {
            event.preventDefault();
            card.classList.remove('drag-over');
            reorderFields(draggedId, field.id);
          });

          card.append(head, body, drag);
          fieldsEl.appendChild(card);
        });
      }

      function iconButton(title, svg, handler, danger) {
        const button = document.createElement('button');
        button.className = 'icon-btn' + (danger ? ' danger' : '');
        button.type = 'button';
        button.title = title;
        button.innerHTML = svg;
        button.addEventListener('click', handler);
        return button;
      }

      function paletteIcon() {
        return '<span class="accent-dot" aria-hidden="true"></span>';
      }

      function trashIcon() {
        return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>';
      }

      function accentColor(name) {
        return ({ blue:'#6f85dc', green:'#58a57c', purple:'#9877cf', orange:'#d89b55', red:'#cb6f79', gray:'#9aa4b5' })[name] || '#6f85dc';
      }

      function cycleAccent(field) {
        const palette = ['blue', 'green', 'purple', 'orange', 'red', 'gray'];
        const index = palette.indexOf(field.accent);
        field.accent = palette[(index + 1 + palette.length) % palette.length];
        scheduleSave();
        renderEditor();
        renderPreview();
      }

      function deleteField(id) {
        const field = state.fields.find(item => item.id === id);
        const label = field && field.label ? ' „' + field.label + '“' : '';
        if (!window.confirm('Opravdu chcete smazat tuto položku' + label + '?')) return;
        state.fields = state.fields.filter(item => item.id !== id);
        scheduleSave();
        renderEditor();
        renderPreview();
      }

      function reorderFields(sourceId, targetId) {
        if (!sourceId || sourceId === targetId) return;
        const from = state.fields.findIndex(item => item.id === sourceId);
        const to = state.fields.findIndex(item => item.id === targetId);
        if (from < 0 || to < 0) return;
        const [item] = state.fields.splice(from, 1);
        state.fields.splice(to, 0, item);
        scheduleSave();
        renderEditor();
        renderPreview();
      }

      function rememberHeight(field, textarea) {
        const next = Math.round(textarea.getBoundingClientRect().height);
        if (!next || next === field.height) return;
        field.height = Math.min(500, Math.max(80, next));
        scheduleSave();
        renderPreview();
      }

      function addField(type) {
        state.fields.push({
          id: createId('field'),
          type,
          label: '',
          required: false,
          height: type === 'textarea' ? 115 : undefined,
          accent: 'blue',
          columns: type === 'checkbox' ? 1 : undefined,
          options: type === 'checkbox' ? [
            { id: createId('opt'), label: 'Možnost 1' },
            { id: createId('opt'), label: 'Možnost 2' }
          ] : undefined
        });
        addMenu.classList.remove('open');
        scheduleSave();
        renderEditor();
        renderPreview();
      }

      function renderPreview() {
        previewContent.innerHTML = '';
        const h = document.createElement('h2');
        h.textContent = state.title || 'Nadpis formuláře';
        const p = document.createElement('p');
        p.textContent = state.instructions || '';
        previewContent.append(h, p);

        state.fields.forEach(field => {
          const wrap = document.createElement('div');
          wrap.className = 'preview-field';
          const label = document.createElement('label');
          label.textContent = field.label || 'Nadpis';
          wrap.appendChild(label);

          if (field.type === 'textarea') {
            const fake = document.createElement('div');
            fake.className = 'preview-input';
            fake.style.minHeight = Math.max(80, Number(field.height) || 115) + 'px';
            wrap.appendChild(fake);
          } else if (field.type === 'checkbox') {
            (field.options || []).forEach(option => {
              const row = document.createElement('div');
              row.style.margin = '8px 0';
              const box = document.createElement('input');
              box.type = 'checkbox'; box.disabled = true;
              row.append(box, document.createTextNode(' ' + option.label));
              wrap.appendChild(row);
            });
          } else {
            const row = document.createElement('div');
            row.textContent = '○ Ano     ○ Ne';
            row.style.padding = '10px 0';
            wrap.appendChild(row);
          }
          previewContent.appendChild(wrap);
        });
      }

      function openPreview() {
        renderPreview();
        previewDrawer.classList.add('open');
        backdrop.classList.add('open');
        previewDrawer.setAttribute('aria-hidden', 'false');
      }

      function closePreview() {
        previewDrawer.classList.remove('open');
        backdrop.classList.remove('open');
        previewDrawer.setAttribute('aria-hidden', 'true');
      }

      function autoSizeInstructions() {
        instructionsEl.style.height = 'auto';
        instructionsEl.style.height = Math.max(28, instructionsEl.scrollHeight) + 'px';
      }

      internalTitleEl.addEventListener('input', () => {
        state.internalTitle = internalTitleEl.value;
        scheduleSave();
      });
      titleEl.addEventListener('input', () => {
        state.title = titleEl.value;
        scheduleSave();
        renderPreview();
      });
      instructionsEl.addEventListener('input', () => {
        state.instructions = instructionsEl.value;
        autoSizeInstructions();
        scheduleSave();
        renderPreview();
      });

      addButton.addEventListener('click', event => {
        event.stopPropagation();
        addMenu.classList.toggle('open');
      });
      addMenu.addEventListener('click', event => {
        const button = event.target.closest('[data-type]');
        if (!button) return;
        addField(button.dataset.type);
      });
      document.addEventListener('click', event => {
        if (!event.target.closest('.add-wrap')) addMenu.classList.remove('open');
      });

      document.getElementById('previewButton').addEventListener('click', openPreview);
      document.getElementById('closePreview').addEventListener('click', closePreview);
      backdrop.addEventListener('click', closePreview);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closePreview();
      });

      renderEditor();
      renderPreview();
      scheduleSave();
    </script>
  </body>
</html>
