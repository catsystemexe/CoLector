<!doctype html>
<html lang="cs">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#079EAE">
  <title>CoLector — Session</title>

  <style>
    :root{
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#182238;
      background:#f4f6fb;
      --accent:#079EAE;
      --header:88px;
      --bottom:112px;
      --line:#e3e7ef;
      --muted:#748096;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#f4f6fb}
    body{overflow:hidden}
    button{font:inherit}

    /* HEADER */
    .session-header{
      position:fixed;
      z-index:50;
      top:0;
      left:0;
      right:0;
      height:var(--header);
      display:grid;
      grid-template-columns:auto auto auto minmax(0,1fr);
      justify-content:start;
      align-items:center;
      gap:10px;
      padding:6px 10px;
      background:#fff;
      border-bottom:1px solid #e6e9f0;
      box-shadow:0 2px 12px rgba(28,38,64,.05);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:7px;
      white-space:nowrap;
      cursor:pointer;
    }

    .brand-mark{width:46px;height:46px;flex:0 0 auto}
    .brand-mark svg{display:block;width:100%;height:100%}
    .section-name{font-size:16px;color:#667288;font-weight:650}

    .session-count{
      display:flex;
      align-items:baseline;
      gap:2px;
      white-space:nowrap;
      padding:0 2px;
      font-weight:850;
      letter-spacing:-.025em;
    }
    .session-count .submitted-count{font-size:25px;color:#23975b}
    .session-count .count-sep{font-size:19px;color:#9aa4b5;font-weight:700}
    .session-count .distributed-count{font-size:25px;color:#2671d9}
    .round-controls{min-width:0;display:flex;align-items:center;justify-content:flex-end;justify-self:end;gap:6px;overflow-x:auto;padding:2px 0 2px 10px;scrollbar-width:none}
    .round-controls::-webkit-scrollbar{display:none}
    .round-lock{flex:0 0 auto;height:38px;min-width:48px;padding:0 9px;border:1px solid #dfe5ee;border-radius:12px;background:#f7f8fb;color:#7b8699;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-weight:900;cursor:pointer}
    .round-lock svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .round-lock.open{background:#f7f8fb;border-color:#dfe5ee;color:#7b8699}
    .round-lock.focused{background:#e8f8f8;border-color:#bce5e5;color:#087f8d;box-shadow:0 0 0 2px rgba(7,158,174,.12)}
    .round-lock:disabled{opacity:.5;cursor:default}

    /* CONTENT */
    main{
      position:fixed;
      top:var(--header);
      bottom:var(--bottom);
      left:0;
      right:0;
      overflow-y:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      padding:12px 10px 22px;
    }

    .content{width:min(100%,680px);margin:0 auto}

    .empty{
      margin-top:22px;
      padding:28px 20px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      text-align:center;
      color:var(--muted);
      box-shadow:0 8px 24px rgba(26,37,62,.05);
    }
    .empty strong{display:block;color:#27334a;margin-bottom:6px;font-size:18px}

    .sheet{
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      padding:20px 14px 26px;
      box-shadow:0 8px 28px rgba(26,37,62,.055);
    }

    .response-view{display:grid}
.response-view .sheet{touch-action:pan-y}
.response-view .sheet.swiping{user-select:none}
.response-browser{display:grid;grid-template-columns:42px minmax(58px,auto) 42px;align-items:center;gap:6px;white-space:nowrap}
.response-nav{width:42px;height:40px;border:1px solid #dfe5ee;border-radius:11px;background:#fff;color:#59647a;font-size:28px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0}
.response-nav:disabled{opacity:.3;cursor:default}
.response-position{text-align:center;color:#4f5c72;font-size:16px;font-weight:900;white-space:nowrap}
.sheet-head{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
    .sheet-title{margin:0;font-size:26px;line-height:1.12;color:#27334a}
    .sheet-team{margin-top:6px;color:#279263;font-weight:750;font-size:14px}
    .instructions{margin:8px 0 0;color:#6f7a8f;line-height:1.45;white-space:pre-wrap}
    .fields{display:grid;gap:14px}
    .field{border:1px solid rgba(133,145,165,.18);border-radius:15px;padding:14px}
    .field-title{font-weight:780;margin-bottom:10px;color:#2d374b;line-height:1.3}

    .answer-text{
      min-height:82px;
      border:1px solid rgba(133,145,165,.22);
      border-radius:11px;
      padding:12px 13px;
      background:rgba(255,255,255,.76);
      color:#2e3748;
      white-space:pre-wrap;
      line-height:1.45;
    }

    .checks{display:grid;gap:8px}
    .check{
      display:flex;
      align-items:center;
      gap:10px;
      min-height:42px;
      padding:8px 10px;
      border:1px solid rgba(133,145,165,.20);
      border-radius:10px;
      background:rgba(255,255,255,.68);
    }

    .check-box{
      width:20px;
      height:20px;
      border:2px solid #adb6c6;
      border-radius:5px;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      color:#fff;
      font-size:13px;
      font-weight:900;
    }
    .check.selected .check-box{background:#079EAE;border-color:#079EAE}

    .yesno{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .yesno-item{
      min-height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(133,145,165,.25);
      border-radius:12px;
      color:#687287;
      font-weight:750;
      background:rgba(255,255,255,.7);
    }
    .yesno-item.selected{border-color:#8bd5d4;background:#eaf8f7;color:#078f9f}

    .accent-blue{background:#f2f5ff}
    .accent-green{background:#f0f8f4}
    .accent-purple{background:#f6f1fb}
    .accent-orange{background:#fff5e9}
    .accent-red{background:#fff0f1}

    /* BOTTOM SESSION ACTIONS — same visual language as Editor */
    .bottom-dock{
      position:fixed;
      z-index:40;
      left:50%;
      bottom:6px;
      transform:translateX(-50%);
      width:min(620px,calc(100% - 12px));
      min-height:var(--bottom);
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      background:rgba(255,255,255,.96);
      border:1px solid #e2e7ee;
      border-radius:22px;
      box-shadow:0 12px 34px rgba(23,34,59,.16);
      backdrop-filter:blur(10px);
    }

    .bottom-inner{
      width:100%;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      align-items:end;
      gap:8px;
    }

    .dock-action{
      min-height:68px;
      border:0;
      border-radius:16px;
      background:transparent;
      color:#59647a;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      font-weight:720;
      cursor:pointer;
    }
    .dock-action:hover{background:#f2f8f8}
    .dock-action:disabled{opacity:.42;cursor:default}

    .dock-action-icon{
      width:46px;
      height:42px;
      border-radius:13px;
      display:grid;
      place-items:center;
      background:#e8f8f8;
      color:#078f9f;
    }
    .dock-action svg{
      width:23px;
      height:23px;
      stroke:currentColor;
      fill:none;
      stroke-width:1.9;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .dock-action-label{font-size:12px;font-weight:720;color:inherit}

    .dock-action.qr{color:#087f8d}
    .dock-action.qr .dock-action-icon{
      width:58px;
      height:58px;
      border-radius:50%;
      margin-top:-20px;
      background:linear-gradient(145deg,#12B8B5,#069EAE 55%,#087CA8);
      color:#fff;
      box-shadow:0 8px 22px rgba(7,158,174,.28);
    }

    /* CoLector loading overlay — shared visual with Home */
    .loading-overlay{
      position:fixed;
      inset:0;
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.96);
      opacity:1;
      transition:opacity 180ms ease;
    }
    .loading-overlay.hidden{opacity:0;pointer-events:none}
    .loading-box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;text-align:center}
    .colector-loader{width:120px;height:120px;display:flex;align-items:center;justify-content:center}
    .colector-loader-svg{width:120px;height:120px;overflow:visible}
    .loading-text{font-size:16px;font-weight:650;color:#27334a;letter-spacing:.1px}
    .loader-layer{transform-box:fill-box;transform-origin:center center;opacity:0}
    .loader-layer-top{animation:colectorLayerTop 2.2s ease-in-out infinite}
    .loader-layer-middle{animation:colectorLayerMiddle 2.2s ease-in-out infinite}
    .loader-layer-bottom{animation:colectorLayerBottom 2.2s ease-in-out infinite}

    @keyframes colectorLayerTop{
      0%{transform:translateY(-16px);opacity:0}
      12%{transform:translateY(-6px);opacity:.35}
      22%{transform:translateY(0);opacity:1}
      48%{transform:translateY(0);opacity:1}
      68%{transform:translateY(16px);opacity:.45}
      84%,100%{transform:translateY(30px);opacity:0}
    }
    @keyframes colectorLayerMiddle{
      0%,14%{transform:translateY(-14px);opacity:0}
      26%{transform:translateY(-4px);opacity:.35}
      36%{transform:translateY(0);opacity:1}
      48%{transform:translateY(0);opacity:1}
      72%{transform:translateY(16px);opacity:.45}
      88%,100%{transform:translateY(30px);opacity:0}
    }
    @keyframes colectorLayerBottom{
      0%,28%{transform:translateY(-12px);opacity:0}
      40%{transform:translateY(-3px);opacity:.35}
      48%{transform:translateY(0);opacity:1}
      56%{transform:translateY(0);opacity:1}
      78%{transform:translateY(16px);opacity:.45}
      92%,100%{transform:translateY(30px);opacity:0}
    }

    /* QR */
    .qr-screen{
      position:fixed;
      z-index:100;
      inset:0;
      background:#fff;
      display:none;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px 18px;
    }
    .qr-screen.open{display:flex}
    .qr-close{position:absolute;top:14px;right:14px;width:44px;height:44px;border:0;border-radius:12px;background:#f1f3f8;color:#556178;font-size:26px}
    .qr-title{margin:0 0 20px;text-align:center;font-size:26px;color:#27334a}
    .qr-box{padding:14px;background:#fff;border-radius:18px;box-shadow:0 10px 34px rgba(25,35,58,.12)}

    @media(max-width:620px){
      :root{--header:86px;--bottom:108px}
      .session-header{padding:5px 7px;gap:6px}
      .brand-mark{width:40px;height:40px}
      .section-name{font-size:13px}
      .session-count .submitted-count,.session-count .distributed-count{font-size:21px}
      .session-count .count-sep{font-size:15px}
      .response-browser{grid-template-columns:36px minmax(50px,auto) 36px;gap:3px}
      .response-nav{width:36px;height:35px;border-radius:9px;font-size:24px}
      .response-position{font-size:14px}
      .round-lock{height:34px;min-width:42px;padding:0 7px}
      main{padding:10px 8px 20px}
      .bottom-dock{border-radius:19px;padding-left:8px;padding-right:8px}
      .dock-action{min-height:62px;font-size:12px}
      .dock-action-icon{width:44px;height:40px}
      .dock-action.qr .dock-action-icon{width:56px;height:56px}
    }

    @media(max-width:420px){
      .brand{gap:3px}
      .brand-mark{width:36px;height:36px}
      .section-name{font-size:12px}
      .session-count .submitted-count,.session-count .distributed-count{font-size:19px}
      .session-count .count-sep{font-size:14px}
      .response-browser{grid-template-columns:32px minmax(44px,auto) 32px}
      .response-nav{width:32px;height:32px;font-size:22px}
      .response-position{font-size:13px}
      .round-lock{height:31px;min-width:38px;padding:0 6px}
      .round-lock svg{width:15px;height:15px}
    }

    @media(prefers-reduced-motion:reduce){
      .loader-layer-top,
      .loader-layer-middle,
      .loader-layer-bottom{
        animation:none;
        opacity:1;
        transform:none;
      }
    }
  </style>
</head>

<body>
  <header class="session-header">
    <div id="homeBrand" class="brand" role="link" tabindex="0" aria-label="Přejít na Home">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 256 256">
          <defs>
            <linearGradient id="sessionBrandGradient" x1="20%" y1="10%" x2="85%" y2="90%">
              <stop offset="0%" stop-color="#12B8B5"/>
              <stop offset="52%" stop-color="#069EAE"/>
              <stop offset="100%" stop-color="#087CA8"/>
            </linearGradient>
          </defs>
          <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#sessionBrandGradient)"/>
          <path d="M128 69 L180 99 Q186 103 180 107 L128 137 L76 107 Q70 103 76 99 Z" fill="#fff"/>
          <path d="M78 126 L128 155 L178 126 L178 140 L128 169 L78 140 Z" fill="#fff"/>
          <path d="M78 151 L128 180 L178 151 L178 165 L128 194 L78 165 Z" fill="#fff"/>
        </svg>
      </div>
      <span class="section-name">/ Session</span>
    </div>

    <div class="session-count" aria-label="Odevzdaných z rozdaných">
      <span id="submittedCount" class="submitted-count">0</span>
      <span class="count-sep">/</span>
      <span id="distributedCount" class="distributed-count">0</span>
    </div>

    <div id="responseBrowser" class="response-browser" aria-label="Procházení odpovědí participantů">
      <button id="prevResponse" class="response-nav" type="button" aria-label="Předchozí participant" title="Předchozí participant" disabled>‹</button>
      <div id="responsePosition" class="response-position">0 / 0</div>
      <button id="nextResponse" class="response-nav" type="button" aria-label="Další participant" title="Další participant" disabled>›</button>
    </div>

    <div id="roundControls" class="round-controls" aria-label="Parts"></div>

  </header>

  <main>
    <div id="content" class="content"></div>
  </main>

  <div class="bottom-dock">
    <div class="bottom-inner">
      <button id="insightsButton" class="dock-action" type="button" disabled aria-label="Vyhodnocení — připravujeme" title="Vyhodnocení — připravujeme">
        <span class="dock-action-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></span>
        <span class="dock-action-label">Vyhodnocení</span>
      </button>
      <button id="sheetButton" class="dock-action" type="button" aria-label="Otevřít Google Sheet" title="Google Sheet">
        <span class="dock-action-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M10 9v12M4 15h16"/></svg></span>
        <span class="dock-action-label">Tabulka</span>
      </button>
      <button id="qrButton" class="dock-action qr" type="button" aria-label="QR kód" title="QR kód">
        <span class="dock-action-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3z"/><path d="M15 14h2v2h-2zM19 14h2v4h-2zM14 19h4v2h-4zM20 20h1v1h-1z"/></svg></span>
        <span class="dock-action-label">QR</span>
      </button>
    </div>
  </div>

  <div id="loadingOverlay" class="loading-overlay" aria-live="polite" aria-busy="true">
    <div class="loading-box">
      <div class="colector-loader" role="status" aria-label="Collecting">
        <svg viewBox="0 0 160 160" class="colector-loader-svg" aria-hidden="true">
          <defs>
            <linearGradient id="sessionLoaderGradient" x1="20%" y1="10%" x2="85%" y2="90%">
              <stop offset="0%" stop-color="#12B8B5"></stop>
              <stop offset="52%" stop-color="#069EAE"></stop>
              <stop offset="100%" stop-color="#087CA8"></stop>
            </linearGradient>
          </defs>
          <g class="loader-layer loader-layer-top"><path fill="url(#sessionLoaderGradient)" d="M80 20 L132 50 Q138 54 132 58 L80 88 L28 58 Q22 54 28 50 Z"></path></g>
          <g class="loader-layer loader-layer-middle"><path fill="url(#sessionLoaderGradient)" d="M30 74 L80 103 L130 74 L130 88 L80 117 L30 88 Z"></path></g>
          <g class="loader-layer loader-layer-bottom"><path fill="url(#sessionLoaderGradient)" d="M30 102 L80 131 L130 102 L130 116 L80 145 L30 116 Z"></path></g>
        </svg>
      </div>
      <div id="loadingText" class="loading-text">Collecting…</div>
    </div>
  </div>

  <div id="qrScreen" class="qr-screen">
    <button id="qrClose" class="qr-close" type="button" aria-label="Zavřít">×</button>
    <h1 id="qrTitle" class="qr-title"></h1>
    <div id="qrBox" class="qr-box"></div>
  </div>

  <script>
    const APP_URL=<?!= JSON.stringify(appUrl) ?>;
    const FORM_ID=<?!= JSON.stringify(formId) ?>;

    const submittedCountEl=document.getElementById('submittedCount');
    const distributedCountEl=document.getElementById('distributedCount');
    const roundControlsEl=document.getElementById('roundControls');
    const prevResponseEl=document.getElementById('prevResponse');
    const nextResponseEl=document.getElementById('nextResponse');
    const responsePositionEl=document.getElementById('responsePosition');
    const contentEl=document.getElementById('content');
    const qrScreen=document.getElementById('qrScreen');
    const qrBox=document.getElementById('qrBox');
    const qrTitle=document.getElementById('qrTitle');
    const sheetButton=document.getElementById('sheetButton');

    let sessionData=null;
    let selectedTeamId='';
    let focusedRoundId='';

    function goHome(){window.top.location.href=APP_URL+'?view=home'}
    function participantUrl(){return APP_URL+'?view=form&form='+encodeURIComponent(FORM_ID)}
    function safeAccent(value){return ['blue','green','purple','orange','red'].includes(value)?value:'blue'}
    function lockSvg(open){return open?'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>'}

    function showLoader(text){
      const overlay=document.getElementById('loadingOverlay');
      const label=document.getElementById('loadingText');
      if(!overlay)return;
      if(text&&label)label.textContent=text;
      overlay.style.display='flex';
      requestAnimationFrame(()=>overlay.classList.remove('hidden'));
      overlay.setAttribute('aria-busy','true');
    }
    function hideLoader(){
      const overlay=document.getElementById('loadingOverlay');
      if(!overlay)return;
      overlay.classList.add('hidden');
      overlay.setAttribute('aria-busy','false');
      setTimeout(()=>{overlay.style.display='none'},180);
    }

    function currentRound(){
      const rounds=(sessionData&&sessionData.rounds)||[];
      return rounds.find(round=>round.roundId===focusedRoundId)||rounds[0]||null;
    }
    function eligibleTeams(){
      const round=currentRound();
      if(!round||!sessionData)return[];
      return (sessionData.teams||[]).filter(team=>(team.completedRoundIds||[]).includes(round.roundId));
    }

    function renderRoundControls(){
      roundControlsEl.innerHTML='';
      const rounds=(sessionData&&sessionData.rounds)||[];
      if(rounds.length<=1)return;
      rounds.forEach(round=>{
        const button=document.createElement('button');
        button.type='button';
        button.className='round-lock'+(round.roundId===focusedRoundId?' focused':'');
        const partLabel=String.fromCharCode(64+Math.max(1,Number(round.number)||1));
        button.title='Zobrazit Part '+partLabel;
        button.setAttribute('aria-label',button.title);
        button.innerHTML='<span>'+partLabel+'</span>';
        button.onclick=()=>{
          const changedRound=focusedRoundId!==round.roundId;
          focusedRoundId=round.roundId;
          if(changedRound)selectedTeamId='';
          renderRoundControls();renderCounts();renderSelectedTeam();
        };
        roundControlsEl.append(button);
      });
    }

    function renderCounts(){
      const round=currentRound();
      submittedCountEl.textContent=String(round?Number(round.submittedCount)||0:0);
      distributedCountEl.textContent=String(round?Number(round.distributedCount)||0:((sessionData&&sessionData.teams)||[]).length);
    }

    function fieldTitle(field){const el=document.createElement('div');el.className='field-title';el.textContent=field.label||'';return el}
    function renderField(field,answers){
      const wrap=document.createElement('section');wrap.className='field accent-'+safeAccent(field.accent);if(field.label)wrap.appendChild(fieldTitle(field));
      const value=answers?answers[field.id]:null;
      if(field.type==='textarea'){const box=document.createElement('div');box.className='answer-text';box.textContent=value==null?'':String(value);wrap.appendChild(box);return wrap}
      if(field.type==='checkbox'){
        const checks=document.createElement('div');checks.className='checks';const selected=Array.isArray(value)?value.map(String):[];
        (field.options||[]).forEach(option=>{const optionId=String(option.id||option.label||'');const row=document.createElement('div');row.className='check'+(selected.includes(optionId)?' selected':'');const box=document.createElement('span');box.className='check-box';box.textContent=selected.includes(optionId)?'✓':'';const text=document.createElement('span');text.textContent=option.label||'';row.append(box,text);checks.appendChild(row)});
        wrap.appendChild(checks);return wrap;
      }
      if(field.type==='yes_no'){
        const group=document.createElement('div');group.className='yesno';
        [{value:'yes',label:'Ano'},{value:'no',label:'Ne'}].forEach(item=>{const el=document.createElement('div');el.className='yesno-item'+(String(value||'')===item.value?' selected':'');el.textContent=item.label;group.appendChild(el)});
        wrap.appendChild(group);return wrap;
      }
      return null;
    }

    function renderResponseBrowser(){
      const teams=eligibleTeams();
      let index=teams.findIndex(team=>team.teamId===selectedTeamId);
      if(index<0&&teams.length)index=0;
      responsePositionEl.textContent=teams.length?((index+1)+' / '+teams.length):'0 / 0';
      prevResponseEl.disabled=index<=0;
      nextResponseEl.disabled=index<0||index>=teams.length-1;
    }

    function selectRelative(delta){
      const teams=eligibleTeams();
      if(!teams.length)return;
      let index=teams.findIndex(team=>team.teamId===selectedTeamId);
      if(index<0)index=0;
      const next=Math.max(0,Math.min(teams.length-1,index+delta));
      if(next===index)return;
      selectedTeamId=teams[next].teamId;
      renderSelectedTeam();
      const main=document.querySelector('main');if(main)main.scrollTo({top:0,behavior:'smooth'});
    }

    function installResponseSwipe(sheet){
      let pointerId=null,startX=0,startY=0,dragging=false;
      sheet.addEventListener('pointerdown',e=>{
        if(e.button!=null&&e.button!==0)return;
        pointerId=e.pointerId;startX=e.clientX;startY=e.clientY;dragging=false;
        sheet.setPointerCapture&&sheet.setPointerCapture(pointerId);
      });
      sheet.addEventListener('pointermove',e=>{
        if(pointerId!==e.pointerId)return;
        const dx=e.clientX-startX,dy=e.clientY-startY;
        if(!dragging){
          if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
          if(Math.abs(dy)>Math.abs(dx)){pointerId=null;return}
          dragging=true;sheet.classList.add('swiping');
        }
        if(dragging)e.preventDefault();
      });
      sheet.addEventListener('pointerup',e=>{
        if(pointerId!==e.pointerId)return;
        const dx=e.clientX-startX;
        sheet.classList.remove('swiping');
        if(dragging&&Math.abs(dx)>=55)selectRelative(dx<0?1:-1);
        pointerId=null;dragging=false;
      });
      sheet.addEventListener('pointercancel',()=>{sheet.classList.remove('swiping');pointerId=null;dragging=false});
    }

    function renderSelectedTeam(){
      if(!sessionData)return;
      const round=currentRound();
      if(!round){renderResponseBrowser();contentEl.innerHTML='<div class="empty"><strong>Session je připravená</strong></div>';return}

      const teams=eligibleTeams();
      if(selectedTeamId&&!teams.some(team=>team.teamId===selectedTeamId))selectedTeamId='';
      if(!selectedTeamId&&teams.length)selectedTeamId=teams[0].teamId;

      const index=teams.findIndex(team=>team.teamId===selectedTeamId);
      const team=index>=0?teams[index]:null;
      const response=team&&sessionData.answersByTeamRound&&sessionData.answersByTeamRound[team.teamId]?sessionData.answersByTeamRound[team.teamId][round.roundId]:null;

      renderResponseBrowser();

      if(!team||!response){
        const partLabel='Part '+String.fromCharCode(64+Math.max(1,Number(round.number)||1));
        contentEl.innerHTML='<div class="empty"><strong>'+partLabel+' čeká na odevzdání</strong>Zatím nebyla odevzdána žádná odpověď v této části.</div>';
        return;
      }

      contentEl.innerHTML='';
      const view=document.createElement('div');view.className='response-view';
      const sheet=document.createElement('section');sheet.className='sheet';
      const head=document.createElement('div');head.className='sheet-head';
      const title=document.createElement('h1');title.className='sheet-title';title.textContent=round.title||(sessionData.schema&&sessionData.schema.internalTitle)||team.teamLabel;
      const teamInfo=document.createElement('div');teamInfo.className='sheet-team';teamInfo.textContent=team.teamLabel+' — Part '+String.fromCharCode(64+Math.max(1,Number(round.number)||1))+' odevzdán';
      head.append(title,teamInfo);
      if(round.instructions){const instructions=document.createElement('p');instructions.className='instructions';instructions.textContent=round.instructions;head.appendChild(instructions)}
      sheet.appendChild(head);
      const fields=document.createElement('div');fields.className='fields';
      (round.fields||[]).forEach(field=>{const rendered=renderField(field,response.answers||{});if(rendered)fields.appendChild(rendered)});
      sheet.appendChild(fields);
      installResponseSwipe(sheet);

      view.append(sheet);contentEl.appendChild(view);
    }

    function renderSession(result){
      sessionData=result;
      sheetButton.disabled=!(result&&result.spreadsheetUrl);
      const rounds=(result&&result.rounds)||[];
      if(!focusedRoundId||!rounds.some(round=>round.roundId===focusedRoundId)){
        focusedRoundId=(rounds[0]||{}).roundId||'';
        selectedTeamId='';
      }
      renderRoundControls();
      renderCounts();
      if((result.teams||[]).length===0){
        selectedTeamId='';
        renderResponseBrowser();
        contentEl.innerHTML='<div class="empty"><strong>Zatím žádný participant</strong>Po otevření QR kódu se počítadlo nahoře aktualizuje.</div>';
        return;
      }
      renderSelectedTeam();
    }

    function loadSession(showBusy){
      if(showBusy)showLoader('Collecting…');
      google.script.run.withSuccessHandler(result=>{renderSession(result);if(showBusy)hideLoader()}).withFailureHandler(error=>{if(showBusy)hideLoader();contentEl.innerHTML='<div class="empty"><strong>Session se nepodařilo načíst</strong>'+((error&&error.message)||'Zkuste stránku obnovit.')+'</div>'}).getSessionView(FORM_ID);
    }

    function loadQrLibrary(){
      if(window.QRCode)return Promise.resolve();
      return new Promise((resolve,reject)=>{const existing=document.querySelector('script[data-colector-qr]');if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});return}const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js';script.dataset.colectorQr='1';script.onload=resolve;script.onerror=reject;document.head.appendChild(script)});
    }
    function showQr(){
      if(!sessionData)return;
      const first=(sessionData.rounds||[])[0];
      qrTitle.textContent=(first&&first.title)||(sessionData.schema&&sessionData.schema.internalTitle)||'Formulář';
      qrBox.innerHTML='';qrScreen.classList.add('open');
      loadQrLibrary().then(()=>{const size=Math.max(220,Math.min(480,Math.floor(Math.min(window.innerWidth*.72,window.innerHeight*.60))));new QRCode(qrBox,{text:participantUrl(),width:size,height:size,colorDark:'#111827',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}).catch(()=>{qrBox.textContent='QR kód se nepodařilo načíst.'});
    }

    document.getElementById('homeBrand').onclick=goHome;
    document.getElementById('homeBrand').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goHome()}};
    prevResponseEl.onclick=()=>selectRelative(-1);
    nextResponseEl.onclick=()=>selectRelative(1);
    document.getElementById('qrButton').onclick=showQr;
    document.getElementById('qrClose').onclick=()=>qrScreen.classList.remove('open');
    sheetButton.onclick=()=>{if(sessionData&&sessionData.spreadsheetUrl)window.open(sessionData.spreadsheetUrl,'_blank','noopener')};

    if(!FORM_ID){hideLoader();contentEl.innerHTML='<div class="empty"><strong>Chybí formulář</strong></div>'}else{loadSession(true);setInterval(()=>loadSession(false),3000)}
  </script>
</body>
</html>
